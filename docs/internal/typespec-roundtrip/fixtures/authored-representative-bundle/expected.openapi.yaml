openapi: 3.2.0
info:
  title: Authored Representative Bundle API
  version: 1.0.0
tags:
  - name: users
    description: User management
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          explode: false
          examples:
            default:
              dataValue: 1
              serializedValue: page=1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          explode: false
          examples:
            default:
              dataValue: 20
              serializedValue: limit=20
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - admin
              - user
              - guest
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsers200Body"
              examples:
                default:
                  dataValue:
                    items:
                      - id: 00000000-0000-0000-0000-000000000001
                        email: alice@example.com
                        name: Alice
                        role: user
                        createdAt: 2024-01-01T00:00:00.000Z
                    total: 1
                  serializedValue: '{"items":[{"id":"00000000-0000-0000-0000-000000000001","email":"alice@example.com","name":"Alice","role":"user","createdAt":"2024-01-01T00:00:00.000Z"}],"total":1}'
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - users
      security:
        - bearerAuth: []
    post:
      operationId: createUser
      summary: Create user
      parameters: []
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  dataValue:
                    id: 00000000-0000-0000-0000-000000000002
                    email: bob@example.com
                    name: Bob
                    role: user
                    createdAt: 2024-01-01T00:00:00.000Z
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      security:
        - bearerAuth: []
  /users/{id}/reports:
    post:
      operationId: reportUser
      summary: Report user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
              examples:
                default:
                  dataValue:
                    id: 00000000-0000-0000-0000-000000000300
                    targetUserId: 00000000-0000-0000-0000-000000000001
                    reporterUserId: 00000000-0000-0000-0000-000000000002
                    reason: harassment
                    status: open
                    createdAt: 2026-05-04T00:00:00.000Z
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      security:
        - bearerAuth: []
components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: At least 8 characters.
      unevaluatedProperties:
        not: {}
      description: User creation request.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - SCHEMA_VALIDATION_FAILED
            - INTERNAL_SERVER_ERROR
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/ErrorMeta"
        _meta:
          $ref: "#/components/schemas/ErrorMeta"
      unevaluatedProperties:
        not: {}
      description: Standard error response schema.
    ErrorMeta:
      type: object
      properties:
        operationId:
          type: string
        requestId:
          type: string
          format: uuid
      unevaluatedProperties:
        not: {}
      description: Error metadata.
    ListUsers200Body:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          minimum: 0
      unevaluatedProperties:
        not: {}
    Report:
      type: object
      required:
        - id
        - targetUserId
        - reporterUserId
        - reason
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        reporterUserId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - spam
            - harassment
            - hate-speech
            - fraud
            - impersonation
            - other
        details:
          type: string
        status:
          type: string
          enum:
            - open
            - under-review
            - resolved
            - dismissed
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
      unevaluatedProperties:
        not: {}
      description: Report record.
      examples:
        - id: 00000000-0000-0000-0000-000000000300
          targetUserId: 00000000-0000-0000-0000-000000000001
          reporterUserId: 00000000-0000-0000-0000-000000000002
          reason: harassment
          status: open
          createdAt: 2026-05-04T00:00:00.000Z
    ReportRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - spam
            - harassment
            - hate-speech
            - fraud
            - impersonation
            - other
        details:
          type: string
          maxLength: 1000
      unevaluatedProperties:
        not: {}
      description: Report request body.
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
        createdAt:
          type: string
          format: date-time
      unevaluatedProperties:
        not: {}
      description: User information.
      examples:
        - id: 00000000-0000-0000-0000-000000000001
          email: alice@example.com
          name: Alice
          role: user
          createdAt: 2024-01-01T00:00:00.000Z
    ValidationError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
        message:
          type: string
        expected:
          type: string
        received: {}
      unevaluatedProperties:
        not: {}
      description: Field-level validation error.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: Bearer
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication metadata
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          refreshUrl: https://auth.example.com/token
          scopes:
            read: Read access
            write: Write access
