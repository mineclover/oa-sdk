openapi: 3.2.0
info:
  title: Authored Bundle API
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          examples:
            default:
              dataValue: 1
              serializedValue: page=1
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
              examples:
                default:
                  dataValue:
                    - id: usr_1
                      name: Alice
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            read:users: Read users
