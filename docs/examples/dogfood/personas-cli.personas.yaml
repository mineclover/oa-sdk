# Dogfood example — @oa-sdk/personas CLI surface
# 검증 매트릭스에 포함되지 않음. 문서 example.
#
# 11 CLI 명령을 페르소나로 모델링. 향후 surface kind 차원 (v0.13?) 도입 시
# 정식으로 src/domains/에 통합 가능.

domain: personas-cli
description: "@oa-sdk/personas CLI surface — meta application of framework to itself"

metadata:
  responsibility: "framework users → CLI 명령. baseline 부트스트랩 / 검증 / coverage / 통합 / 자동 생성."
  owns_entities:
    - "PersonaMatrix"            # src/domains/*.personas.yaml
    - "ProjectMeta"               # .persona-project.yaml (wizard 산출)
    - "BoundSpec"                 # .merged.persona.yaml (bind 산출)
    - "CoverageReport"             # pnpm coverage stdout
    - "GeneratedTestSuite"         # apps/playground/tests/*.generated.test.ts
    - "ProposedStubs"              # pnpm propose stdout
    - "FlowGraph"                  # pnpm flow stdout (mermaid)
    - "ProfileExpansion"            # pnpm profiles show 결과
  allowed_actors:
    - framework-developer          # 신규 — oa-sdk 자체 개발자
    - ci-bot                       # 신규 — GitHub Actions / 자동화
    - auditor                      # 신규 — 컴플라이언스 검토자

# ── baseline phase (1회) ─────────────────────────────────────────────────
personas:
  - id: dev-bootstraps-baseline
    status: proposed
    identity:
      actor: framework-developer
      data: ProjectMeta
      intent: create
      trigger: first-arrival
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [private-self]
      expects: [0]                 # exit code 0
    notes: |
      신규 프로젝트 도입 시 `pnpm wizard` 1회 실행. baseline 결정.
      재실행 시 abort (--reset 필요). 단방향 transition.

  # ── signal-driven phase (반복) ─────────────────────────────────────────
  - id: dev-validates-pre-commit
    status: proposed
    identity:
      actor: framework-developer
      data: PersonaMatrix
      intent: validate
      trigger: pre-commit
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [private-self]
      expects: [0]
    skills: [retryable]
    notes: "git pre-commit hook이 `pnpm validate` 실행. 22 룰 통과 못하면 commit 차단."

  - id: ci-bot-checks-pr
    status: proposed
    identity:
      actor: ci-bot
      data: PersonaMatrix
      intent: validate
      trigger: ci-gate
      consumer: automation
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [audited]
      expects: [0]
    skills: [retryable, audit-emission]
    notes: "PR check가 `pnpm check` (merge → bind → validate) 실행. drift / orphan / vocab 위반 차단."

  - id: dev-iterates-from-spec
    status: proposed
    identity:
      actor: framework-developer
      data: PersonaMatrix
      intent: transform
      trigger: design-review
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [private-self]
      expects: [0]
    notes: "spec 변경 후 `pnpm propose --from-spec` 으로 3 signal (orphan + new-op + new-schema) 자동 감지 → 사람 review."

  - id: dev-binds-after-merge
    status: proposed
    identity:
      actor: framework-developer
      data: BoundSpec
      intent: transform
      trigger: design-review
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [private-self]
      expects: [0]
    notes: "schemas merge 후 `pnpm bind` — `.merged.yaml` → `.merged.persona.yaml`. drift 차단의 전제."

  - id: dev-regenerates-tests
    status: proposed
    identity:
      actor: framework-developer
      data: GeneratedTestSuite
      intent: transform
      trigger: design-review
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [private-self]
      expects: [0]
    notes: "페르소나 promote 후 `pnpm gen:tests` — implemented 페르소나마다 vitest `it()` 자동."

  # ── inspection / review phase ─────────────────────────────────────────
  - id: auditor-reviews-compliance
    status: proposed
    identity:
      actor: auditor
      data: CoverageReport
      intent: inspect
      trigger: audit-review
      consumer: developer-tool
    reference:
      regulation: [pii-kr-pipa, pii-gdpr]
      channel: [cli]
    outcome:
      shape: detail
      access: [audited]
      expects: [0]
    skills: [audit-emission]
    notes: "분기 컴플라이언스 검토 — `pnpm coverage --profile=pipa-compliance` 로 PIPA footprint 추출."

  - id: dev-explores-flow
    status: proposed
    identity:
      actor: framework-developer
      data: FlowGraph
      intent: inspect
      trigger: design-review
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: detail
      access: [private-self]
      expects: [0]
    notes: "설계 회의에서 `pnpm flow` — mermaid + topological layers로 페르소나 간 의존 시각화."

  - id: dev-queries-profile
    status: proposed
    identity:
      actor: framework-developer
      data: ProfileExpansion
      intent: inspect
      trigger: design-review
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: list-paginated
      access: [private-self]
      expects: [0]
    skills: [pagination]
    notes: "`pnpm profiles list` / `pnpm profiles show <id>` — saved query expand 결과 조회."

  - id: dev-acts-on-orphan
    status: proposed
    identity:
      actor: framework-developer
      data: ProposedStubs
      intent: transform
      trigger: ci-gate
      consumer: developer-tool
    reference:
      channel: [cli]
    outcome:
      shape: bulk-batch
      access: [private-self]
      expects: [0]
    skills: [batch]
    notes: "orphan 발견 시 `pnpm propose` → stub yaml 검토 → 승격."

  - id: ci-bot-runs-tests
    status: proposed
    identity:
      actor: ci-bot
      data: GeneratedTestSuite
      intent: monitor
      trigger: ci-gate
      consumer: automation
    reference:
      channel: [cli]
    outcome:
      shape: command
      access: [audited]
      expects: [0]
    skills: [retryable, audit-emission, metrics-emission]
    notes: "PR check가 `pnpm test` (130 unit) + playground `pnpm test` (211 e2e) 실행. 실패 시 차단."
