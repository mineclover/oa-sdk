name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0  # spec diff에 base branch 이력 필요

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ──────────────────────────────────────────────
      - name: Build core platform
        run: pnpm build:core

      - name: Build downstream SDKs
        run: pnpm build:downstream

      - name: Build maintenance packages
        run: pnpm build:maintenance

      - name: Build application and reference workspaces
        run: pnpm build:internal

      - name: Build CI scripts
        run: pnpm build:scripts

      # ── Typecheck ──────────────────────────────────────────
      - name: Typecheck core platform
        run: pnpm typecheck:core

      - name: Typecheck downstream SDKs
        run: pnpm typecheck:downstream

      - name: Typecheck maintenance packages
        run: pnpm typecheck:maintenance

      - name: Typecheck application and reference workspaces
        run: pnpm typecheck:internal

      # ── Test ───────────────────────────────────────────────
      - name: Test core platform
        run: pnpm test:core:ci

      - name: Test downstream SDKs
        run: pnpm test:downstream:ci

      - name: Test maintenance packages
        run: pnpm test:maintenance:ci

      - name: Test application workspaces
        run: pnpm test:internal:ci

      # ── Schema validation ──────────────────────────────────
      - name: Schema validate
        run: |
          pnpm schema:validate
          pnpm --filter @oa-sdk/schemas run test

      - name: TypeSpec production migration gates
        run: |
          pnpm schema:typespec-check
          pnpm schema:rollback-check
          pnpm schema:downstream-check

      # ── Freshness check: generated files up to date? ───────
      - name: Schema freshness check
        run: |
          pnpm --filter @oa-sdk/schemas run build
          if ! git diff --exit-code packages/schemas/src/.merged.3.1.yaml packages/schemas/src/.merged.3.1.meta.json packages/schemas/src/.merged.upgraded.3.2.yaml; then
            echo "::error::Schema generated files are stale. Run 'pnpm --filter @oa-sdk/schemas run build' and commit the results."
            exit 1
          fi

      # ── API index drift check ────────────────────────────────
      - name: API index consistency
        run: pnpm check:api-index

      - name: CLI spec consistency
        run: pnpm check:cli-spec

      - name: Codegen boundary consistency
        run: pnpm check:codegen-boundaries

      - name: Documentation consistency
        run: |
          pnpm test:docs-gates
          pnpm check:docs

      - name: Feature test matrix consistency
        run: pnpm check:feature-tests

      - name: DPM package surface smoke
        run: pnpm check:dpm-surface

      - name: Workspace scope and release policy
        run: pnpm check:workspace-scope

      # ── Spec diff (PR only) ────────────────────────────────
      - name: API spec diff
        if: github.event_name == 'pull_request'
        run: pnpm spec:diff -- --git origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"
