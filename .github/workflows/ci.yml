name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0  # spec diff에 base branch 이력 필요

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ──────────────────────────────────────────────
      - name: Build packages
        run: pnpm build

      - name: Build CI scripts
        run: pnpm build:scripts

      # ── Typecheck ──────────────────────────────────────────
      - name: Type check
        run: pnpm typecheck

      # ── Test ───────────────────────────────────────────────
      - name: Test
        run: pnpm test

      # ── Schema validation ──────────────────────────────────
      - name: Schema validate
        run: |
          pnpm schema:validate
          pnpm --filter @oa-sdk/schemas run test

      # ── Freshness check: generated files up to date? ───────
      - name: Schema freshness check
        run: |
          pnpm --filter @oa-sdk/schemas run build
          if ! git diff --exit-code packages/schemas/src/.merged.3.1.yaml packages/schemas/src/.merged.3.1.meta.json packages/schemas/src/.merged.upgraded.3.2.yaml; then
            echo "::error::Schema generated files are stale. Run 'pnpm --filter @oa-sdk/schemas run build' and commit the results."
            exit 1
          fi

      # ── API index drift check ────────────────────────────────
      - name: API index consistency
        run: node scripts/dist/check-api-index.mjs

      # ── Spec diff (PR only) ────────────────────────────────
      - name: API spec diff
        if: github.event_name == 'pull_request'
        run: node scripts/dist/spec-diff.mjs --git origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"
