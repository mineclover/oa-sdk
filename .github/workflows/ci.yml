name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0  # spec diff에 base branch 이력 필요

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ──────────────────────────────────────────────
      - name: Build core platform
        run: pnpm build:core

      - name: Build downstream SDKs
        run: pnpm build:downstream

      - name: Build maintenance packages
        run: pnpm build:maintenance

      - name: Build application and reference workspaces
        run: pnpm build:internal

      - name: Build CI scripts
        run: pnpm build:scripts

      # ── Typecheck ──────────────────────────────────────────
      - name: Typecheck core platform
        run: pnpm typecheck:core

      - name: Typecheck downstream SDKs
        run: pnpm typecheck:downstream

      - name: Typecheck maintenance packages
        run: pnpm typecheck:maintenance

      - name: Typecheck application and reference workspaces
        run: pnpm typecheck:internal

      # ── Test ───────────────────────────────────────────────
      - name: Test core platform
        run: pnpm test:core:ci

      - name: Test downstream SDKs
        run: pnpm test:downstream:ci

      - name: Test maintenance packages
        run: pnpm test:maintenance:ci

      - name: Test application workspaces
        run: pnpm test:internal:ci

      # ── Schema validation ──────────────────────────────────
      - name: Schema validate
        run: |
          pnpm schema:validate
          pnpm --filter @oa-sdk/schemas run test

      - name: TypeSpec production migration gates
        run: |
          pnpm schema:typespec-check
          pnpm schema:typespec-provenance-check
          pnpm schema:rollback-check
          pnpm schema:downstream-check

      # ── Freshness check: generated files up to date? ───────
      - name: Schema freshness check
        run: |
          pnpm --filter @oa-sdk/schemas run bundle
          node packages/codegen/dist/cli/index.js check-artifact --head packages/schemas/src/.merged.3.1.yaml --artifact packages/schemas/dist/openapi.yaml
          if ! git diff --exit-code packages/schemas/src/.merged.3.1.yaml packages/schemas/src/.merged.3.1.meta.json packages/schemas/src/.merged.upgraded.3.2.yaml; then
            echo "::error::Schema generated files are stale. Run 'pnpm --filter @oa-sdk/schemas run bundle' and commit the results."
            exit 1
          fi

      # ── API index drift check ────────────────────────────────
      - name: API index consistency
        run: pnpm check:api-index

      - name: CLI spec consistency
        run: pnpm check:cli-spec

      - name: Codegen boundary consistency
        run: pnpm check:codegen-boundaries

      - name: Documentation consistency
        run: |
          pnpm test:docs-gates
          pnpm check:docs

      - name: Feature test matrix consistency
        run: pnpm check:feature-tests

      - name: DPM package surface smoke
        run: pnpm check:dpm-surface

      - name: OA Gen package surface smoke
        run: pnpm --filter @oa-sdk/codegen run smoke:pack

      - name: Workspace scope and release policy
        run: pnpm check:workspace-scope

      # ── Spec diff (PR only) ────────────────────────────────
      - name: API spec diff
        if: github.event_name == 'pull_request'
        run: |
          pnpm spec:diff -- --git origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"
          pnpm schema:check-contract-version -- --base-ref origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"

  governance-references:
    name: OpenAPI governance reference gates
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OA Gen CLI
        run: pnpm --filter @oa-sdk/codegen build

      - name: Run NestJS reference governance
        working-directory: apps/nestjs-ref
        env:
          OA_GEN: node ../../packages/codegen/dist/cli/index.js
        run: bash scripts/openapi-governance.sh ci

      - name: Run FastAPI reference governance
        working-directory: apps/fastapi-ref
        env:
          OA_GEN: node ../../packages/codegen/dist/cli/index.js
        run: |
          uv sync
          bash scripts/openapi-governance.sh ci

      - name: Upload NestJS governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-ref-openapi-governance
          path: apps/nestjs-ref/.oa-sdk/governance
          if-no-files-found: warn

      - name: Upload FastAPI governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-ref-openapi-governance
          path: apps/fastapi-ref/.oa-sdk/governance
          if-no-files-found: warn
