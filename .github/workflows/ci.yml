name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0  # spec diff에 base branch 이력 필요

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ──────────────────────────────────────────────
      - name: Build core platform
        run: pnpm build:core

      - name: Build downstream SDKs
        run: pnpm build:downstream

      - name: Build maintenance packages
        run: pnpm build:maintenance

      - name: Build application and reference workspaces
        run: pnpm build:internal

      - name: Build CI scripts
        run: pnpm build:scripts

      # ── Typecheck ──────────────────────────────────────────
      - name: Typecheck core platform
        run: pnpm typecheck:core

      - name: Typecheck downstream SDKs
        run: pnpm typecheck:downstream

      - name: Typecheck maintenance packages
        run: pnpm typecheck:maintenance

      - name: Typecheck application and reference workspaces
        run: pnpm typecheck:internal

      # ── Test ───────────────────────────────────────────────
      - name: Test core platform
        run: pnpm test:core:ci

      - name: Test downstream SDKs
        run: pnpm test:downstream:ci

      - name: Test maintenance packages
        run: pnpm test:maintenance:ci

      - name: Test application workspaces
        run: pnpm test:internal:ci

      # ── Schema validation ──────────────────────────────────
      # packages/schemas was already built by build:core. Reuse that exact
      # TypeSpec artifact instead of compiling the same bundle in every gate.
      - name: Validate prepared schema artifact
        run: |
          pnpm --filter @oa-sdk/schemas run validate:spectral
          pnpm --filter @oa-sdk/schemas run validate:redocly
          node packages/codegen/dist/cli/index.js validate --spec packages/schemas/src/.merged.yaml --require-32
          pnpm --filter @oa-sdk/schemas run test

      - name: TypeSpec downstream consumption
        run: pnpm schema:downstream-check -- --spec packages/schemas/src/.merged.yaml --skip-build

      # ── Freshness check: generated files up to date? ───────
      - name: Schema freshness check
        run: |
          node packages/codegen/dist/cli/index.js check-artifact --head packages/schemas/src/.merged.3.1.yaml --artifact packages/schemas/dist/openapi.yaml
          if ! git diff --exit-code packages/schemas/src/.merged.3.1.yaml packages/schemas/src/.merged.3.1.meta.json packages/schemas/src/.merged.upgraded.3.2.yaml; then
            echo "::error::Schema generated files are stale. Run 'pnpm --filter @oa-sdk/schemas run bundle' and commit the results."
            exit 1
          fi

      - name: OpenAPI rollback path
        run: |
          pnpm test:schema-rollback-check
          pnpm schema:rollback-check -- --typespec-report packages/schemas/src/.builder/typespec-bundle-report.json

      # ── API index drift check ────────────────────────────────
      - name: API index consistency
        run: pnpm check:api-index

      - name: CLI spec consistency
        run: pnpm check:cli-spec

      - name: Codegen boundary consistency
        run: pnpm check:codegen-boundaries

      - name: Type Registry governance
        run: pnpm type-registry:check

      - name: Browser runtime entrypoint boundary
        run: node apps/preview/scripts/browser-runtime-smoke.mjs

      - name: Documentation consistency
        run: |
          pnpm test:docs-gates
          pnpm check:docs

      - name: Feature test matrix consistency
        run: pnpm check:feature-tests

      - name: DPM package surface smoke
        run: pnpm check:dpm-surface

      - name: OA Gen package surface smoke
        run: pnpm --filter @oa-sdk/codegen run smoke:pack

      - name: Workspace scope and release policy
        run: pnpm check:workspace-scope

      # ── Spec diff (PR only) ────────────────────────────────
      - name: API spec diff
        if: github.event_name == 'pull_request'
        run: |
          pnpm spec:diff -- --git origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"
          pnpm schema:check-contract-version -- --base-ref origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"

  public-release-runtime:
    name: Public release runtime / Node ${{ matrix.node }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      # Public artifacts are built and packed with the repository development
      # toolchain. Only consumer execution is switched to the advertised
      # engines.node matrix below.
      - name: Set up development Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public release candidates
        run: pnpm --filter @oa-sdk/codegen... run build

      - name: Prepare packed public consumer
        run: node scripts/public-runtime-smoke.mjs prepare "${RUNNER_TEMP}/oa-sdk-public-runtime"

      - name: Set up consumer Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke public imports and CLI
        run: node scripts/public-runtime-smoke.mjs verify "${RUNNER_TEMP}/oa-sdk-public-runtime" "${{ matrix.node }}"

  typescript-7-current:
    name: Node 26 / TypeScript 7 / ttsc compatibility
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build stable Core declarations
        run: pnpm build:core

      - name: Check TypeScript 7 and ttsc compatibility
        run: pnpm check:ts7

  governance-references:
    name: OpenAPI governance reference gates
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OA Gen CLI
        run: pnpm --filter @oa-sdk/codegen build

      - name: Run NestJS reference governance
        working-directory: apps/nestjs-ref
        env:
          OA_GEN: node ../../packages/codegen/dist/cli/index.js
        run: bash scripts/openapi-governance.sh ci

      - name: Run FastAPI reference governance
        working-directory: apps/fastapi-ref
        env:
          OA_GEN: node ../../packages/codegen/dist/cli/index.js
        run: |
          uv sync
          bash scripts/openapi-governance.sh ci

      - name: Upload NestJS governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-ref-openapi-governance
          path: apps/nestjs-ref/.oa-sdk/governance
          if-no-files-found: warn

      - name: Upload FastAPI governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-ref-openapi-governance
          path: apps/fastapi-ref/.oa-sdk/governance
          if-no-files-found: warn
