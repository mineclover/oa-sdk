name: CI

# Essential GitHub gate only. The full lane set (maintenance/internal workspaces, schema
# validation, rollback, public runtime on Node 22/24/26, TS7, NestJS/FastAPI governance) runs
# locally with `pnpm ci:local`; GitHub Actions billing currently cannot start those jobs anyway.
# Keep this workflow to the product-critical build/typecheck/test and governance checks.

on:
  # Run once before merge. A post-merge push run duplicated the same full gate.
  pull_request:
    branches: [main]
  # Use this for direct main pushes or an on-demand full verification.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Essential build, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core platform
        run: pnpm build:core

      - name: Build downstream SDKs
        run: pnpm build:downstream

      - name: Typecheck core platform
        run: pnpm typecheck:core

      - name: Typecheck downstream SDKs
        run: pnpm typecheck:downstream

      - name: Test core platform
        # Keep the same package coverage while using each package's parallel, cacheable test task.
        run: pnpm test:core

      - name: Test downstream SDKs
        # Keep the same package coverage while avoiding the serial test:ci lane.
        run: pnpm test:downstream

      - name: Test integration harnesses
        run: pnpm test:integration

      - name: Test TypeSpec plugin pipeline end to end
        run: pnpm test:e2e:typespec-plugin

      - name: Parser $ref expansion budget
        timeout-minutes: 10
        env:
          BENCH_PARSER_BUDGET_SCALE: '2'
        run: pnpm bench:parser

      - name: Package version constants
        run: pnpm check:package-versions

      - name: Browser runtime entrypoint boundary
        # The smoke inspects the built preview bundle; build:core/build:downstream do not build apps.
        run: |
          pnpm --filter @oa-sdk/preview build
          node apps/preview/scripts/browser-runtime-smoke.mjs

      - name: Documentation consistency
        run: |
          pnpm test:docs-gates
          pnpm check:docs

      - name: Governance manifests
        run: |
          pnpm test:verification
          pnpm check:feature-tests
          pnpm check:verification
          pnpm test:api-index
          pnpm check:api-index
          pnpm check:cli-spec
          pnpm check:codegen-boundaries
          pnpm type-registry:check
          pnpm check:workspace-scope
