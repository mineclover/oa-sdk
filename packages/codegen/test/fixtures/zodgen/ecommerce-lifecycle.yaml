openapi: 3.2.0
info:
  title: E-Commerce Order Lifecycle API
  version: 1.0.0
  description: Real-world OAS 3.2 spec modeling complete order processing with exclusive bounds, tuples, object sealing, and metadata.
components:
  schemas:
    Money:
      type: object
      description: Monetary amount with strict positive currency
      required:
        - amount
        - currency
      additionalProperties: false
      properties:
        amount:
          type: number
          description: Strict positive transaction amount
          exclusiveMinimum: 0.00
          multipleOf: 0.01
        currency:
          type: string
          description: ISO 4217 currency code
          pattern: "^[A-Z]{3}$"
          default: "USD"

    Address:
      type: object
      description: Sealed postal delivery address
      required:
        - street
        - city
        - country
      unevaluatedProperties: false
      properties:
        street:
          type: string
          minLength: 3
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"

    Coordinate:
      type: array
      description: Geographical [latitude, longitude] tuple with optional elevation rest
      prefixItems:
        - type: number
          minimum: -90.0
          maximum: 90.0
        - type: number
          minimum: -180.0
          maximum: 180.0
      items:
        type: number
        description: Rest elevation elements in meters

    OrderLineItem:
      type: object
      required:
        - itemId
        - quantity
        - unitPrice
      additionalProperties: false
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          type: integer
          exclusiveMinimum: 0
        unitPrice:
          $ref: "#/components/schemas/Money"

    OrderStatus:
      type: string
      enum:
        - Pending
        - Paid
        - Shipped
        - Delivered
        - Cancelled
      default: Pending

    Order:
      type: object
      description: Core customer order entity
      required:
        - orderId
        - customerId
        - status
        - items
        - shippingAddress
        - total
      additionalProperties: false
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineItem"
        shippingAddress:
          $ref: "#/components/schemas/Address"
        deliveryCoordinates:
          $ref: "#/components/schemas/Coordinate"
        total:
          $ref: "#/components/schemas/Money"
        notes:
          type: string
          maxLength: 500
