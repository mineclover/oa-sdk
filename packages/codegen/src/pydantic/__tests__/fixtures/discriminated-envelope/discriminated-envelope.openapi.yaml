openapi: 3.2.0
info:
  title: Discriminated Envelope Fixture
  version: 0.0.0
tags: []
paths:
  /pet:
    get:
      operationId: pet
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pet2:
    get:
      operationId: pet2
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet2'
components:
  schemas:
    Cat:
      type: object
      required:
        - name
        - meow
      properties:
        name:
          type: string
        meow:
          type: integer
          format: int32
    Dog:
      type: object
      required:
        - name
        - bark
      properties:
        name:
          type: string
        bark:
          type: string
    Pet:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PetCat'
        - $ref: '#/components/schemas/PetDog'
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/PetCat'
          dog: '#/components/schemas/PetDog'
    Pet2:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Pet2Cat'
        - $ref: '#/components/schemas/Pet2Dog'
      discriminator:
        propertyName: type
        mapping:
          cat: '#/components/schemas/Pet2Cat'
          dog: '#/components/schemas/Pet2Dog'
    Pet2Cat:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - cat
        data:
          $ref: '#/components/schemas/Cat'
    Pet2Dog:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - dog
        data:
          $ref: '#/components/schemas/Dog'
    PetCat:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - cat
        value:
          $ref: '#/components/schemas/Cat'
    PetDog:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - dog
        value:
          $ref: '#/components/schemas/Dog'
