domain: auth
description: "인증 도메인 — 가입/로그인/토큰 갱신/로그아웃"

# data 어휘 (도메인-로컬):
#   Account     — 사용자 계정 (Users 도메인의 User와 같지만 인증 컨텍스트)
#   Session     — access/refresh 토큰 페어 또는 활성 세션 자체
#   Credential  — 이메일·비밀번호

personas:
  - id: guest-signup
    status: implemented
    identity:
      actor: guest
      data: Account
      intent: create
      trigger: first-arrival
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [register]
      expects: [201]
    notes: "공개 가입. PII 수집(email, name, password) — PIPA 적용. 동시 회원가입 폭주 방지 위해 rate-limited."

  - id: guest-login
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: authenticate
      trigger: return-visit
    reference:
      channel: [browser, mobile-app, cli]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [login]
      expects: [200]
    notes: "인증 자체는 PII 처리지만 login은 로그 외 데이터 노출 없음. brute-force 방지로 rate-limited 필수."

  - id: user-token-refresh
    status: implemented
    identity:
      actor: user
      data: Session
      intent: authenticate
      trigger: token-expiring
    reference:
      channel: [browser, mobile-app, cli, public-api]
    outcome:
      shape: token
      access: [public]    # access token은 만료됐을 수 있으므로 refresh는 자기 토큰으로만 인증
      maps_to: [refreshToken]
      expects: [200]

  - id: user-logout
    status: implemented
    identity:
      actor: user
      data: Session
      intent: revoke
      trigger: leave-device
    reference:
      channel: [browser, mobile-app, cli]
    outcome:
      shape: command
      access: [private-self]
      maps_to: [logout]
      expects: [204]
    notes: "intent: revoke — 자기 access token 무효화. refresh token도 동시 폐기될 수 있음."

  # ── negative-path (orphan response 해소) ─────────────────────────────
  - id: malformed-register-body
    status: implemented
    identity:
      actor: guest
      data: Account
      intent: create
      trigger: malformed-payload
    reference:
      channel: [browser, mobile-app]
    outcome:
      shape: token
      access: [public]
      maps_to: [register]
      expects: [422]
    notes: "negative-path. 비밀번호 8자 미만 등 schema 위반 → 422. register의 422 응답 커버."

  - id: duplicate-email-register
    status: implemented
    identity:
      actor: guest
      data: Account
      intent: create
      trigger: duplicate-identity
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: token
      access: [public]
      maps_to: [register]
      expects: [409]
    notes: "negative-path. 이미 가입된 이메일 → 409 CONFLICT. register의 409 응답 커버."

  - id: register-rate-limited
    status: implemented
    identity:
      actor: guest
      data: Account
      intent: create
      trigger: rate-limit-hit
    reference:
      channel: [public-api]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [register]
      expects: [429]
    notes: "negative-path. 회원가입 폭주 → 429 + Retry-After. register의 429 응답 커버."

  - id: login-bad-credentials
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: authenticate
      trigger: wrong-password
    reference:
      channel: [browser, mobile-app, cli]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [login]
      expects: [401]
    notes: "negative-path. 잘못된 비밀번호 → 401. login의 401 응답 커버."

  - id: login-rate-limited
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: authenticate
      trigger: brute-force-detected
    reference:
      channel: [public-api]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [login]
      expects: [429]
    notes: "negative-path. brute-force 감지 → 429 + Retry-After. login의 429 응답 커버."

  # ── perspective expansion (consumer 차원) ─────────────────────────────
  - id: backend-svc-token-refresh
    status: implemented
    identity:
      actor: third-party-app
      data: Session
      intent: authenticate
      trigger: token-expiring
      consumer: backend
    reference:
      channel: [public-api]
    outcome:
      shape: token
      access: [public]
      maps_to: [refreshToken]
      expects: [200]
    notes: "service-to-service: 백엔드 서비스가 자기 access token 만료 임박 시 refresh. user-token-refresh와 동일 op지만 consumer가 backend (machine-to-machine)."

  # ── password reset flow (이전 proposed → 모두 implemented) ────────────
  - id: guest-password-reset-request
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: forgot-password
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [forgotPassword]
      expects: [204]
    notes: "POST /auth/forgot-password. enumeration 방지 위해 이메일 미존재여도 동일 204."

  - id: guest-password-reset-confirm
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: reset-link-clicked
    reference:
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [resetPassword]
      expects: [204]
    notes: "POST /auth/reset-password — reset 토큰 + new password."

  # ── auto-promoted from v0.6 propose (negative-path coverage) ────────

  - id: malformed-forgotPassword
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: malformed-request
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [forgotPassword]
      expects: [400]
    notes: "negative-path. 잘못된 요청 형식 → 400. forgotPassword의 400 응답 커버."
  - id: malformed-payload-forgotPassword
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: malformed-payload
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [forgotPassword]
      expects: [422]
    notes: "negative-path. schema 위반 → 422. forgotPassword의 422 응답 커버."
  - id: rate-limited-forgotPassword
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: rate-limit-hit
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [forgotPassword]
      expects: [429]
    notes: "negative-path. 요청 한도 초과 → 429. forgotPassword의 429 응답 커버."

  - id: malformed-login
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: authenticate
      trigger: malformed-request
    reference:
      channel: [browser, mobile-app, cli]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [login]
      expects: [400]
    notes: "negative-path. 잘못된 요청 형식 → 400. login의 400 응답 커버."
  - id: malformed-payload-login
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: authenticate
      trigger: malformed-payload
    reference:
      channel: [browser, mobile-app, cli]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [login]
      expects: [422]
    notes: "negative-path. schema 위반 → 422. login의 422 응답 커버."

  - id: guest-unauthorized-logout
    status: implemented
    identity:
      actor: guest
      data: Session
      intent: revoke
      trigger: missing-auth
    reference:
      channel: [browser, mobile-app, cli]
    outcome:
      shape: command
      access: [public]
      maps_to: [logout]
      expects: [401]
    notes: "negative-path. 미인증 호출 → 401. logout의 401 응답 커버."

  - id: guest-unauthorized-refreshToken
    status: implemented
    identity:
      actor: guest
      data: Session
      intent: authenticate
      trigger: missing-auth
    reference:
      channel: [browser, mobile-app, cli, public-api]
    outcome:
      shape: token
      access: [public]
      maps_to: [refreshToken]
      expects: [401]
    notes: "negative-path. 미인증 호출 → 401. refreshToken의 401 응답 커버."
  - id: malformed-payload-refreshToken
    status: implemented
    identity:
      actor: user
      data: Session
      intent: authenticate
      trigger: malformed-payload
    reference:
      channel: [browser, mobile-app, cli, public-api]
    outcome:
      shape: token
      access: [public]
      maps_to: [refreshToken]
      expects: [422]
    notes: "negative-path. schema 위반 → 422. refreshToken의 422 응답 커버."

  - id: malformed-register
    status: implemented
    identity:
      actor: guest
      data: Account
      intent: create
      trigger: malformed-request
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, mobile-app]
    outcome:
      shape: token
      access: [public, rate-limited]
      maps_to: [register]
      expects: [400]
    notes: "negative-path. 잘못된 요청 형식 → 400. register의 400 응답 커버."

  - id: malformed-resetPassword
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: malformed-reset-request
    reference:
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [resetPassword]
      expects: [400]
    notes: "negative-path. 잘못된 요청 형식 → 400. resetPassword의 400 응답 커버."
  - id: guest-unauthorized-resetPassword
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: missing-auth
    reference:
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public]
      maps_to: [resetPassword]
      expects: [401]
    notes: "negative-path. 미인증 호출 → 401. resetPassword의 401 응답 커버."
  - id: malformed-payload-resetPassword
    status: implemented
    identity:
      actor: guest
      data: Credential
      intent: update
      trigger: malformed-reset-payload
    reference:
      channel: [browser, mobile-app]
    outcome:
      shape: command
      access: [public, rate-limited]
      maps_to: [resetPassword]
      expects: [422]
    notes: "negative-path. schema 위반 → 422. resetPassword의 422 응답 커버."

