domain: me
description: "셀프 서비스 도메인 — 현재 인증된 사용자가 자기 자원만 접근"

metadata:
  kind: openapi-http
  responsibility: "자기 데이터 — 본인이 자기 자원에만 read/update/delete/export"
  owns_entities:
    - "User(self)"
    - "Credential(self)"
    - "OnboardingChecklist"
  allowed_actors: [owner-self, guest]

# data 어휘 (도메인-로컬):
#   User(self)        — 인증 토큰의 주인인 사용자 객체
#   Credential(self)  — 자기 비밀번호

personas:
  - id: user-self-read
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: read-detail
      trigger: profile-page
    reference:
      regulation: [ privacy-self-disclosure ]
      channel: [ browser, mobile-app, public-api ]
    outcome:
      shape: detail
      access: [ private-self ]
      maps_to: [ getMe ]
      expects: [ 200 ]
    links:
      - linkType: depends_on
        target: guest-login
        reason: "logged-in 상태 전제 — bearerAuth 토큰 필요"

  - id: user-self-update
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: update
      trigger: edit-profile
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: detail
      access: [ private-self ]
      maps_to: [ updateMe ]
      expects: [ 200 ]
    links:
      - linkType: depends_on
        target: guest-login
        reason: "logged-in 상태 전제"
    notes: "role 변경 불가 — admin이 /users/{id}로만 변경. spec의 UpdateMeRequest에 role 미포함으로 강제."

  - id: user-self-change-password
    status: implemented
    identity:
      actor: owner-self
      data: Credential(self)
      intent: update
      trigger: security-hardening
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser, mobile-app ]
      region: [ KR ]
    outcome:
      shape: command
      access: [ private-self, audited, rate-limited ]
      maps_to: [ changeMyPassword ]
      expects: [ 204 ]
    skills: [ audit-emission, rate-limit-honored ]
    links:
      - linkType: depends_on
        target: guest-login
        reason: "현재 비밀번호 검증 위해 logged-in 상태 필요"
    notes: "비밀번호 변경은 감사 로그 필수. brute-force 방지 위해 rate-limited."

  # ── negative-path (orphan response 해소) ─────────────────────────────
  - id: guest-unauthorized-getMe
    status: implemented
    identity:
      actor: guest
      data: User(self)
      intent: read-detail
      trigger: missing-auth
    reference:
      channel: [ browser, mobile-app, public-api ]
    outcome:
      shape: detail
      access: [ public ]
      maps_to: [ getMe ]
      expects: [ 401 ]
    notes: "negative-path. 미인증 호출 → 401. getMe의 401 응답 커버."

  - id: guest-unauthorized-updateMe
    status: implemented
    identity:
      actor: guest
      data: User(self)
      intent: update
      trigger: missing-auth
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: detail
      access: [ public ]
      maps_to: [ updateMe ]
      expects: [ 401 ]
    notes: "negative-path. 미인증 호출 → 401. updateMe의 401 응답 커버."

  - id: guest-unauthorized-changePassword
    status: implemented
    identity:
      actor: guest
      data: Credential(self)
      intent: update
      trigger: missing-auth
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: command
      access: [ public ]
      maps_to: [ changeMyPassword ]
      expects: [ 401 ]
    notes: "negative-path. 미인증 호출 → 401. changeMyPassword의 401 응답 커버."

  # ── self-service expansion (이전 proposed → 모두 implemented) ────────
  - id: onboarding-checklist
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: read-detail
      trigger: first-login
      proficiency: onboarding
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: detail
      access: [ private-self ]
      maps_to: [ getOnboardingChecklist ]
      expects: [ 200 ]
    notes: "GET /me/onboarding — 첫 로그인 시 가이드용 체크리스트. skill=onboarding 차원이 별 surface를 요구하는 케이스."

  - id: user-self-delete-account
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: soft-delete
      trigger: leave-service
    reference:
      regulation: [ pii-kr-pipa, pii-gdpr ]
      channel: [ browser, mobile-app ]
      region: [ KR, EU ]
    outcome:
      shape: command
      access: [ private-self, audited ]
      maps_to: [ deleteMyAccount ]
      expects: [ 204 ]
    skills: [ audit-emission ]
    notes: "DELETE /me — soft-delete (30일 복구 가능). PIPA 파기 요구권 / GDPR right-to-erasure."

  - id: user-self-data-export
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: export
      trigger: gdpr-portability
    reference:
      regulation: [ pii-gdpr ]
      channel: [ browser ]
      region: [ EU ]
    outcome:
      shape: bulk-batch
      access: [ private-self, audited, rate-limited ]
      maps_to: [ requestMyDataExport ]
      expects: [ 202 ]
    skills: [ audit-emission, batch, idempotent, rate-limit-honored ]
    notes: "POST /me/export — GDPR 정보주체 이동권. 비동기 job receipt만 정의하며 완료 상태와 다운로드 전달은 runtime 계약이 소유."

  # ── auto-promoted from v0.6 propose (negative-path coverage) ────────

  - id: malformed-changeMyPassword
    status: implemented
    identity:
      actor: owner-self
      data: Credential(self)
      intent: update
      trigger: malformed-request
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser, mobile-app ]
      region: [ KR ]
    outcome:
      shape: command
      access: [ private-self, audited, rate-limited ]
      maps_to: [ changeMyPassword ]
      expects: [ 400 ]
    skills: [ audit-emission, rate-limit-honored ]
    notes: "negative-path. 잘못된 요청 형식 → 400. changeMyPassword의 400 응답 커버."
  - id: malformed-payload-changeMyPassword
    status: implemented
    identity:
      actor: owner-self
      data: Credential(self)
      intent: update
      trigger: malformed-payload
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser, mobile-app ]
      region: [ KR ]
    outcome:
      shape: command
      access: [ private-self, audited, rate-limited ]
      maps_to: [ changeMyPassword ]
      expects: [ 422 ]
    skills: [ audit-emission, rate-limit-honored ]
    notes: "negative-path. schema 위반 → 422. changeMyPassword의 422 응답 커버."

  - id: guest-unauthorized-deleteMyAccount
    status: implemented
    identity:
      actor: guest
      data: User(self)
      intent: soft-delete
      trigger: missing-auth
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: command
      access: [ public ]
      maps_to: [ deleteMyAccount ]
      expects: [ 401 ]
    notes: "negative-path. 미인증 호출 → 401. deleteMyAccount의 401 응답 커버."

  - id: guest-unauthorized-getOnboardingChecklist
    status: implemented
    identity:
      actor: guest
      data: OnboardingChecklist
      intent: read-detail
      trigger: missing-auth
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: detail
      access: [ public ]
      maps_to: [ getOnboardingChecklist ]
      expects: [ 401 ]
    notes: "negative-path. 미인증 호출 → 401. getOnboardingChecklist의 401 응답 커버."

  - id: guest-unauthorized-requestMyDataExport
    status: implemented
    identity:
      actor: guest
      data: User(self)
      intent: export
      trigger: missing-auth
    reference:
      channel: [ browser ]
    outcome:
      shape: bulk-batch
      access: [ public ]
      maps_to: [ requestMyDataExport ]
      expects: [ 401 ]
    skills: [ batch, idempotent ]
    notes: "negative-path. 미인증 호출 → 401. requestMyDataExport의 401 응답 커버."
  - id: rate-limited-requestMyDataExport
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: export
      trigger: rate-limit-hit
    reference:
      regulation: [ pii-gdpr ]
      channel: [ browser ]
      region: [ EU ]
    outcome:
      shape: bulk-batch
      access: [ private-self, audited, rate-limited ]
      maps_to: [ requestMyDataExport ]
      expects: [ 429 ]
    skills: [ audit-emission, batch, idempotent, rate-limit-honored ]
    notes: "negative-path. 요청 한도 초과 → 429. requestMyDataExport의 429 응답 커버."

  - id: malformed-updateMe
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: update
      trigger: malformed-request
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: detail
      access: [ private-self ]
      maps_to: [ updateMe ]
      expects: [ 400 ]
    notes: "negative-path. 잘못된 요청 형식 → 400. updateMe의 400 응답 커버."
  - id: malformed-payload-updateMe
    status: implemented
    identity:
      actor: owner-self
      data: User(self)
      intent: update
      trigger: malformed-payload
    reference:
      channel: [ browser, mobile-app ]
    outcome:
      shape: detail
      access: [ private-self ]
      maps_to: [ updateMe ]
      expects: [ 422 ]
    notes: "negative-path. schema 위반 → 422. updateMe의 422 응답 커버."
