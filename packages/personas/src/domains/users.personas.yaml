      maps_to: [createUser]
      expects: [400]
    notes: "negative-path. 잘못된 요청 형식 → 400. createUser의 400 응답 커버."
  - id: guest-unauthorized-createUser
    status: implemented
    identity:
      actor: guest
      data: User(any)
      intent: create
      trigger: missing-auth
    reference:
      channel: [browser, public-api]
    outcome:
      shape: detail
      access: [public]
      maps_to: [createUser]
      expects: [401]
    notes: "negative-path. 미인증 호출 → 401. createUser의 401 응답 커버."
  - id: malformed-payload-createUser
    status: implemented
    identity:
      actor: admin
      data: User(any)
      intent: create
      trigger: malformed-payload
    reference:
      regulation: [pii-kr-pipa]
      channel: [browser, public-api]
    outcome:
      shape: detail
      access: ["scoped:admin", audited]
      maps_to: [createUser]
      expects: [422]
    notes: "negative-path. schema 위반 → 422. createUser의 422 응답 커버."
  - id: guest-unauthorized-deleteUser
    status: implemented
    identity:
      actor: guest
      data: User(any)
      intent: hard-delete
      trigger: missing-auth
    reference:
      channel: [browser]
    outcome:
      shape: command
      access: [public]
      maps_to: [deleteUser]
      expects: [401]
    notes: "negative-path. 미인증 호출 → 401. deleteUser의 401 응답 커버."
  - id: not-found-deleteUser
    status: implemented
    identity:
      actor: admin
