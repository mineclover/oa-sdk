      trigger: ops-monitoring
      consumer: data-eng
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ csv-export ]
      region: [ KR ]
      compliance_framework: [ ISMS-P, SOC2 ]
    outcome:
      shape: bulk-batch
      access: [ scoped:admin, audited, pseudonymized ]
      maps_to: [ requestUsersExport ]
      expects: [ 202 ]
    skills: [ audit-emission, batch, idempotent, pii-masked-default, pseudonymized ]
    notes: "데이터 엔지니어 daily ETL — POST /admin/users/export가 비동기 ExportJob을 생성. 기본 pseudonymize=true로 bulk PII export를 비식별화."

