  # ── perspective expansion (consumer 차원) — 같은 op, 다른 stakeholder 시점 ────
  - id: backend-svc-list-users
    status: implemented
    identity:
      actor: third-party-app # service-to-service token
      data: User(any)
      intent: list
      trigger: ops-monitoring
      consumer: backend
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ public-api ]
      region: [ KR ]
    outcome:
      shape: list-paginated
      access: [ scoped:read, audited ]
      maps_to: [ listUsers ]
      expects: [ 200 ]
    skills: [ audit-emission, pagination ]
    links:
      - linkType: refines
        target: admin-monitor
        reason: "같은 listUsers — admin-monitor의 backend-perspective 변종"
    notes: "내부 백엔드 서비스가 user 동기화 — service-to-service. partner-sdk가 아닌 internal mTLS. PII 필드 마스킹 필수."

  - id: b2b-customer-list-users
    status: implemented
    identity:
      actor: third-party-app
      data: User(any)
      intent: list
      trigger: ops-monitoring
      consumer: b2b-customer
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ partner-sdk ]
      region: [ KR, GLOBAL ]
      compliance_framework: [ SOC2, ISO27001 ]
    outcome:
      shape: list-paginated
      access: [ scoped:read, audited, rate-limited ]
      maps_to: [ listUsers ]
      expects: [ 200 ]
    skills: [ audit-emission, oauth-scope-aware, pagination, pii-masked-default, rate-limit-honored ]
    links:
      - linkType: refines
        target: admin-monitor
        reason: "같은 listUsers의 b2b-customer perspective 변종 — partner-sdk channel + rate-limit 추가"
    notes: "B2B 파트너 OAuth 통합 — scope=read 위임받아 호출. partner-sdk channel, polling보다 webhook 권장."

  - id: data-eng-bulk-export-users
