      access: ["scoped:admin", audited, "scoped:read"]
      maps_to: [listModerationReports]
      expects: [403]
    notes: "negative-path. 권한 부족 → 403. listModerationReports의 403 응답 커버."

  - id: guest-unauthorized-listMyRoleChanges
    status: implemented
    identity:
      actor: guest
      data: Role
      intent: list
      trigger: missing-auth
    reference:
      channel: [mobile-app, browser]
    outcome:
      shape: list-paginated
      access: [public]
      maps_to: [listMyRoleChanges]
      expects: [401]
    notes: "negative-path. 미인증 호출 → 401. listMyRoleChanges의 401 응답 커버."

  - id: malformed-reportUser
    status: implemented
