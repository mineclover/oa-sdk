    outcome:
      shape: detail
      access: [ scoped:read, audited ]
      maps_to: [ updateUser ]
      expects: [ 403 ]
    skills: [ audit-emission ]
    notes: "negative-path. 일반 user가 admin endpoint를 호출 → 403. updateUser의 403 응답 커버. 권한 우회 시도는 audit 필수."

  - id: getUserById-not-found
