domain: users
description: "사용자 관리 도메인 — admin이 임의 사용자에 대해 수행하는 surface (셀프 surface는 me 도메인)"

metadata:
  kind: openapi-http
  responsibility: "사용자 데이터 admin operations — list/조회/관리/모더레이션 (셀프 surface는 me 도메인 책임)"
  owns_entities:
    - "User(any)"
    - "User(other)"
    - "Role"
    - "Report"
  allowed_actors:
    - admin
    - user
    - moderator
    - target-of-action
    - third-party-app
    - system
    - guest

# data 어휘 (도메인-로컬):
#   User(any)    — 임의 사용자 (admin 컨텍스트)
#   User(other)  — 자기가 아닌 다른 사용자 (일반 user 컨텍스트)
#   Role         — 사용자 역할 enum 자체

# 의도적으로 페르소나로 모델링하지 않는 orphan 응답 — propose CLI가 skip하고
# coverage는 별도 섹션에 표시. 새 페르소나로 채우지 말 것.
acknowledged_orphans:
  - operationId: createUser
    statusCode: "500"
    reason: "infrastructure error — no actor causes this; contract obligation only."

personas:
  - id: admin-monitor
    status: implemented
    identity:
      actor: admin
      data: User(any)
      intent: list
      trigger: ops-monitoring
      consumer: internal-tool
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser, public-api ]
      region: [ KR ]
      compliance_framework: [ SOC2, ISMS-P ]
    outcome:
      shape: list-paginated
      access: [ scoped:admin, audited ]
      maps_to: [ listUsers ]
      expects: [ 200 ]
    skills: [ audit-emission, filter-by-role, filter-by-status, pagination, pii-visible-admin ]
    notes: "운영 대시보드용. PIPA 적용 — 마스킹 또는 운영자 본인 확인 강화."

  - id: admin-user-detail
    status: implemented
    identity:
      actor: admin
      data: User(any)
      intent: read-detail
      trigger: user-support
      consumer: internal-tool
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser ]
      region: [ KR ]
    outcome:
      shape: detail
      access: [ scoped:admin, audited ]
      maps_to: [ getUserById ]
      expects: [ 200 ]
    skills: [ audit-emission, pii-visible-admin ]

  - id: admin-create-user
    status: implemented
    identity:
      actor: admin
      data: User(any)
      intent: create
      trigger: bulk-onboarding
      consumer: internal-tool
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser, public-api ]
      region: [ KR ]
    outcome:
      shape: detail
      access: [ scoped:admin, audited ]
      maps_to: [ createUser ]
      expects: [ 201 ]
    skills: [ audit-emission, pii-visible-admin ]
    notes: "공개 가입(register)과 별개. 운영자가 사전 등록하는 경우. 이메일 중복은 409."

  - id: admin-role-grant
    status: implemented
    identity:
      actor: admin
      data: Role
      intent: update
      trigger: privilege-management
      consumer: internal-tool
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser ]
      region: [ KR ]
    outcome:
      shape: detail
      access: [ scoped:admin, audited ]
      maps_to: [ updateUser ]
      expects: [ 200 ]
    skills: [ audit-emission, pii-visible-admin ]
    notes: "PATCH /users/{id} {role}. 역할 변경은 감사 필수."

  - id: admin-user-removal
    status: implemented
    identity:
      actor: admin
      data: User(any)
      intent: hard-delete
      trigger: violation-action
      consumer: internal-tool
    reference:
      regulation: [ pii-kr-pipa ]
      channel: [ browser ]
      region: [ KR ]
    outcome:
      shape: command
      access: [ scoped:admin, audited ]
      maps_to: [ deleteUser ]
      expects: [ 204 ]
    skills: [ audit-emission, pii-visible-admin ]
    notes: "현 spec의 DELETE /users/{id} 는 hard-delete. soft-delete가 필요하면 별 페르소나로 추가."

  # ── negative-path (orphan response 해소) ─────────────────────────────
  - id: guest-unauthorized-list
    status: implemented
    identity:
      actor: guest
      data: User(any)
      intent: list
      trigger: missing-auth
    reference:
      channel: [ public-api, browser ]
    outcome:
      shape: list-paginated
      access: [ public ] # 인증 없는 시도
      maps_to: [ listUsers ]
      expects: [ 401 ]
    skills: [ pagination ]
    notes: "negative-path. 미인증 호출 → 401. listUsers의 401 응답 커버. happy-path는 admin-monitor."

  - id: non-admin-update-other-user
    status: implemented
