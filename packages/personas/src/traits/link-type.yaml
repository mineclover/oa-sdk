# 페르소나 간 관계 — qa-sdk/definition-catalog 의 LinkType 어휘 중 페르소나 컨텍스트에
# 의미 있는 4종만 차용 (10종 중 contains/refs/traces_to/implements/evolves_from/constrains/verifies는 spec/code 메타에 더 적합).
#
# 참고: ~/workflow/qa-sdk/packages/definition-catalog/src/types.ts
# 호환성: qa-sdk LinkType과 같은 식별자 사용 — 향후 공통 패키지 분리 시 자연스럽게 흡수.

categories:
  - id: temporal
    description: "시간 의존 — A가 B 이후에 발동"
  - id: structural
    description: "구조 변종 — A가 B의 perspective 변형"
  - id: lifecycle
    description: "이력 — 이 페르소나가 다른 페르소나를 대체"

values:
  - id: depends_on
    category: temporal
    direction: upstream                     # target(B)이 먼저, source(A)가 나중
    description: |
      A→B 시 A는 B의 행동이 *완료된 후*에만 의미 있음.
      예: user-self-read depends_on guest-login (로그인 안 됐으면 자기 정보 조회 불가).

  - id: refines
    category: structural
    direction: downstream                   # source가 target의 구체화/변종
    description: |
      A→B 시 A는 B의 perspective 변종 — 같은 op/data를 다른 stakeholder가 호출.
      예: b2b-customer-list-users refines admin-monitor (둘 다 listUsers, perspective만 다름).

  - id: supersedes
    category: lifecycle
    direction: downstream
    description: |
      A→B 시 A가 B를 대체. B는 deprecated 후보.
      예: 페르소나 id 변경 / 정의 변경 / 도메인 재구조화 시.
