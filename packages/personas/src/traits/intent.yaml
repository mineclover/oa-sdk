# intent 차원 어휘 — 페르소나가 이루려는 행위 유형
# 같은 데이터에 대한 다른 intent는 다른 페르소나.

values:
  - id: create
    description: "신규 리소스 생성"
    status: stable

  - id: read-detail
    description: "단건 상세 조회"
    status: stable

  - id: list
    description: "다건 조회 (페이지네이션 포함 가능)"
    status: stable

  - id: search
    description: "필터/전문/패싯 등 능동적 탐색"
    status: stable

  - id: update
    description: "기존 리소스 수정"
    status: stable

  - id: soft-delete
    description: "복구 가능한 비공개/삭제"
    status: stable

  - id: hard-delete
    description: "복구 불가 영구 삭제"
    status: stable

  - id: moderate
    description: "운영자 행동 — 숨김, 경고, 정지"
    status: stable

  - id: report
    description: "신고 — 다른 actor의 행위/콘텐츠를 운영자에게 알림"
    status: stable

  - id: appeal
    description: "이의제기 — 자신에 대한 처분 재심"
    status: stable

  - id: export
    description: "데이터 내보내기 — bulk/csv/legal-compliance 포함"
    status: stable

  - id: authenticate
    description: "토큰 발급/검증/갱신 — credential 또는 refresh-token으로 새 access token 획득"
    status: stable

  - id: revoke
    description: "발급된 토큰/세션/권한의 폐기 — logout, scope 회수, refresh-token 무효화"
    status: stable

  - id: monitor
    description: "관찰 — 상태/지표 수집 (state mutation 없음)"
    status: stable

  - id: subscribe
    description: "이벤트 구독 — SSE/WebSocket/webhook"
    status: stable

  - id: inspect
    description: "변경 없이 메타/구조 조회 — read-detail이 데이터 본체라면 inspect는 검토/감사 목적의 메타 조회"
    status: proposed

  - id: transform
    description: "한 형식 → 다른 형식으로 변환 — bind, codegen, schema merge, build artifacts"
    status: proposed

  - id: validate
    description: "규칙 검증 — 22 룰, 컴플라이언스, schema validation. 본질적으로 read-only + judgement"
    status: proposed
