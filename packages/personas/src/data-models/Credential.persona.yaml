# Data-modeling persona — Credential 엔티티
# 비밀번호 / reset 토큰 등 인증 자격증명. PII 중에서도 가장 민감.

entity: Credential
description: "인증 자격증명 — 이메일 + 비밀번호 / refresh 토큰 / reset 토큰"

local_variants:
  - id: Credential
    description: "임의 사용자의 자격증명 (인증 컨텍스트)"
  - id: Credential(self)
    description: "본인 자격증명 (changePassword 컨텍스트)"

invariants:
  pii: true
  sensitivity: highest                    # 비밀번호 자체는 평문 응답 절대 불가
  fields_pii: [email, password]
  fields_never_returned: [password, currentPassword, newPassword, refreshToken, resetToken]
  fields_logged_masked: [email]           # 로그에 이메일 기록 시 마스킹 (al***@example.com)

  retention:
    rotation_required: true
    rotation_event: change-password / forgot-password / brute-force-detected
    refresh_token_lifetime_days: 30
    reset_token_lifetime_minutes: 15

  audit:
    required_on: [create, update, authenticate, revoke]
    audit_fields: [id, intent, actor_id, ip_address, user_agent, timestamp]
    correlation_required: true

  privacy:
    enumeration_protection: true          # forgot-password는 이메일 미존재여도 동일 204 반환
    rate_limit_required: true             # brute-force 방지
    rate_limit_threshold: "5 attempts / 15 minutes"

access_patterns:
  - intent: authenticate
    valid_actors: [guest, user, third-party-app]
    notes: "guest=login, user=token-refresh, third-party-app=service-to-service refresh"
  - intent: revoke
    valid_actors: [user]
    notes: "logout 또는 admin이 force-logout 시 (별 endpoint 필요 — proposed)"
  - intent: update
    valid_actors: [owner-self, guest]
    notes: "owner-self=changeMyPassword, guest=resetPassword (token 검증 후)"

regulations: [pii-kr-pipa, pii-gdpr]
