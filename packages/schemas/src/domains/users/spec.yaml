# users 도메인 — 사용자 CRUD
tags:
  - name: users
    description: 사용자 관리

paths:
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 사용자 목록 조회
      description: 페이지네이션과 역할 필터를 지원하는 사용자 목록 API
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          description: 역할 필터
          schema:
            type: string
            enum: [admin, user, guest]
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                    minimum: 0
              examples:
                default:
                  dataValue:
                    items:
                      - id: "00000000-0000-0000-0000-000000000001"
                        email: "alice@example.com"
                        name: "Alice"
                        role: user
                        createdAt: "2024-01-01T00:00:00.000Z"
                    total: 1
                  serializedValue: '{"items":[{"id":"00000000-0000-0000-0000-000000000001","email":"alice@example.com","name":"Alice","role":"user","createdAt":"2024-01-01T00:00:00.000Z"}],"total":1}'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [users]
      operationId: createUser
      summary: 사용자 생성
      description: 이메일, 이름, 비밀번호를 받아 새 사용자를 생성합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              default:
                dataValue:
                  email: "bob@example.com"
                  name: "Bob"
                  password: "secure1234"
                serializedValue: '{"email":"bob@example.com","name":"Bob","password":"secure1234"}'
      responses:
        '201':
          description: 사용자 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000002"
                    email: "bob@example.com"
                    name: "Bob"
                    role: user
                    createdAt: "2024-01-01T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 사용자 UUID
        schema:
          type: string
          format: uuid
        examples:
          default:
            dataValue: "00000000-0000-0000-0000-000000000001"
            serializedValue: "00000000-0000-0000-0000-000000000001"

    get:
      tags: [users]
      operationId: getUserById
      summary: 사용자 단건 조회
      description: UUID로 특정 사용자의 상세 정보를 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000001"
                    email: "alice@example.com"
                    name: "Alice"
                    role: user
                    createdAt: "2024-01-01T00:00:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [users]
      operationId: updateUser
      summary: 사용자 수정 (부분 업데이트)
      description: 이름, 역할 등 사용자 정보를 부분적으로 수정합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              default:
                dataValue:
                  name: "Alice Updated"
                serializedValue: '{"name":"Alice Updated"}'
      responses:
        '200':
          description: 수정된 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000001"
                    email: "alice@example.com"
                    name: "Alice Updated"
                    role: user
                    createdAt: "2024-01-01T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [users]
      operationId: deleteUser
      summary: 사용자 삭제
      description: UUID로 특정 사용자를 삭제합니다. 복구 불가.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 삭제 완료 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    User:
      type: object
      description: 사용자 정보
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, guest]
        createdAt:
          type: string
          format: date-time
      examples:
        alice:
          dataValue:
            id: "00000000-0000-0000-0000-000000000001"
            email: "alice@example.com"
            name: "Alice"
            role: user
            createdAt: "2024-01-01T00:00:00.000Z"

    CreateUserRequest:
      type: object
      description: 사용자 생성 요청
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: 최소 8자 이상

    UpdateUserRequest:
      type: object
      description: 사용자 수정 요청 (부분 업데이트 — 모든 필드 optional)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, guest]
