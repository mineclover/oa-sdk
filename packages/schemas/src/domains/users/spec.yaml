# users 도메인 — 사용자 CRUD
tags:
  - name: users
    description: 사용자 관리

paths:
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 사용자 목록 조회
      description: 페이지네이션과 역할 필터를 지원하는 사용자 목록 API
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          description: 역할 필터
          schema:
            type: string
            enum: [admin, user, guest]
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                    minimum: 0
                example:
                  items:
                    - id: "00000000-0000-0000-0000-000000000001"
                      email: "alice@example.com"
                      name: "Alice"
                      role: user
                      createdAt: "2024-01-01T00:00:00.000Z"
                  total: 1
              examples:
                default:
                  dataValue:
                    items:
                      - id: "00000000-0000-0000-0000-000000000001"
                        email: "alice@example.com"
                        name: "Alice"
                        role: user
                        createdAt: "2024-01-01T00:00:00.000Z"
                    total: 1
                  serializedValue: '{"items":[{"id":"00000000-0000-0000-0000-000000000001","email":"alice@example.com","name":"Alice","role":"user","createdAt":"2024-01-01T00:00:00.000Z"}],"total":1}'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [users]
      operationId: createUser
      summary: 사용자 생성
      description: 이메일, 이름, 비밀번호를 받아 새 사용자를 생성합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              default:
                dataValue:
                  email: "bob@example.com"
                  name: "Bob"
                  password: "secure1234"
                serializedValue: '{"email":"bob@example.com","name":"Bob","password":"secure1234"}'
      responses:
        '201':
          description: 사용자 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000002"
                    email: "bob@example.com"
                    name: "Bob"
                    role: user
                    createdAt: "2024-01-01T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 사용자 UUID
        schema:
          type: string
          format: uuid
        examples:
          default:
            dataValue: "00000000-0000-0000-0000-000000000001"
            serializedValue: "00000000-0000-0000-0000-000000000001"

    get:
      tags: [users]
      operationId: getUserById
      summary: 사용자 단건 조회
      description: UUID로 특정 사용자의 상세 정보를 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000001"
                    email: "alice@example.com"
                    name: "Alice"
                    role: user
                    createdAt: "2024-01-01T00:00:00.000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [users]
      operationId: updateUser
      summary: 사용자 수정 (부분 업데이트)
      description: 이름, 역할 등 사용자 정보를 부분적으로 수정합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              default:
                dataValue:
                  name: "Alice Updated"
                serializedValue: '{"name":"Alice Updated"}'
      responses:
        '200':
          description: 수정된 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000001"
                    email: "alice@example.com"
                    name: "Alice Updated"
                    role: user
                    createdAt: "2024-01-01T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [users]
      operationId: deleteUser
      summary: 사용자 삭제
      description: UUID로 특정 사용자를 삭제합니다. 복구 불가.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 삭제 완료 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/public:
    parameters:
      - name: id
        in: path
        required: true
        description: 사용자 UUID
        schema:
          type: string
          format: uuid
        examples:
          default:
            dataValue: "00000000-0000-0000-0000-000000000001"
            serializedValue: "00000000-0000-0000-0000-000000000001"

    get:
      tags: [users]
      operationId: getPublicUserProfile
      summary: 공개 프로필 조회
      description: |
        다른 user의 공개 가시 정보(이름, 역할). email/createdAt 등 PII 미포함.
        멘션·검색 결과 등에서 사용. user/scoped:read 이상 필요.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 공개 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000001"
                    name: "Alice"
                    role: user
                  serializedValue: '{"id":"00000000-0000-0000-0000-000000000001","name":"Alice","role":"user"}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/reports:
    parameters:
      - name: id
        in: path
        required: true
        description: 신고 대상 사용자 UUID
        schema:
          type: string
          format: uuid

    post:
      tags: [users]
      operationId: reportUser
      summary: 사용자 신고
      description: |
        혐오·스팸·사기 등 정책 위반 사용자를 운영자에게 신고. 신고자는 인증된
        user. 동일 신고자→대상 페어는 24시간 내 1회로 rate-limit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            examples:
              default:
                dataValue:
                  reason: harassment
                  details: "공격적 메시지 반복 발신"
                serializedValue: '{"reason":"harassment","details":"공격적 메시지 반복 발신"}'
      responses:
        '201':
          description: 신고 접수 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
              examples:
                default:
                  dataValue:
                    id: "00000000-0000-0000-0000-000000000300"
                    targetUserId: "00000000-0000-0000-0000-000000000001"
                    reporterUserId: "00000000-0000-0000-0000-000000000002"
                    reason: harassment
                    status: open
                    createdAt: "2026-05-04T00:00:00.000Z"
                  serializedValue: '{"id":"00000000-0000-0000-0000-000000000300","targetUserId":"00000000-0000-0000-0000-000000000001","reporterUserId":"00000000-0000-0000-0000-000000000002","reason":"harassment","status":"open","createdAt":"2026-05-04T00:00:00.000Z"}'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /moderation/reports:
    get:
      tags: [users]
      operationId: listModerationReports
      summary: 신고 큐 조회 (운영자)
      description: |
        운영자(moderator) 전용. 처리 대기/처리 중 신고 일람. status 필터로
        open/under-review/resolved 등 분기.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: 신고 상태 필터
          schema:
            type: string
            enum: [open, under-review, resolved, dismissed]
      responses:
        '200':
          description: 신고 큐
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  total:
                    type: integer
                    minimum: 0
                example:
                  items:
                    - id: "00000000-0000-0000-0000-000000000300"
                      targetUserId: "00000000-0000-0000-0000-000000000001"
                      reporterUserId: "00000000-0000-0000-0000-000000000002"
                      reason: harassment
                      status: open
                      createdAt: "2026-05-04T00:00:00.000Z"
                  total: 1
              examples:
                default:
                  dataValue:
                    items:
                      - id: "00000000-0000-0000-0000-000000000300"
                        targetUserId: "00000000-0000-0000-0000-000000000001"
                        reporterUserId: "00000000-0000-0000-0000-000000000002"
                        reason: harassment
                        status: open
                        createdAt: "2026-05-04T00:00:00.000Z"
                    total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/export:
    post:
      tags: [users]
      operationId: requestUsersExport
      summary: 사용자 PII bulk export 작업 요청
      description: |
        data-eng ETL surface. 사용자 PII bulk export를 비동기 job으로 등록하고
        ExportJob을 반환합니다. non-admin perspective로 소비되는 export는
        pseudonymization이 필수이며 기본값도 pseudonymize=true입니다. 호출은 audited.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersExportRequest'
            examples:
              default:
                dataValue:
                  format: json
                  pseudonymize: true
                serializedValue: '{"format":"json","pseudonymize":true}'
      responses:
        '202':
          description: bulk export job 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
              examples:
                default:
                  dataValue:
                    jobId: "00000000-0000-0000-0000-000000000201"
                    status: queued
                    requestedAt: "2026-05-04T00:00:00.000Z"
                  serializedValue: '{"jobId":"00000000-0000-0000-0000-000000000201","status":"queued","requestedAt":"2026-05-04T00:00:00.000Z"}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/users/{id}/purge:
    parameters:
      - name: id
        in: path
        required: true
        description: 영구 삭제 대상 사용자 UUID
        schema:
          type: string
          format: uuid
        examples:
          default:
            dataValue: "00000000-0000-0000-0000-000000000001"
            serializedValue: "00000000-0000-0000-0000-000000000001"

    post:
      tags: [users]
      operationId: purgeUser
      summary: 사용자 영구 삭제
      description: |
        site-admin authority only. deleteUser와 달리 30일 soft-delete window를
        우회하는 hard purge입니다. legal hold override 여부와 사유를 감사 로그에
        남기며 호출은 audited.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeUserRequest'
            examples:
              default:
                dataValue:
                  reason: "confirmed policy violation"
                  legalHoldOverride: false
                serializedValue: '{"reason":"confirmed policy violation","legalHoldOverride":false}'
      responses:
        '204':
          description: 영구 삭제 완료 (본문 없음)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    User:
      type: object
      description: 사용자 정보
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, guest]
        createdAt:
          type: string
          format: date-time
      examples:
        - id: "00000000-0000-0000-0000-000000000001"
          email: "alice@example.com"
          name: "Alice"
          role: user
          createdAt: "2024-01-01T00:00:00.000Z"
      example:
        id: "00000000-0000-0000-0000-000000000001"
        email: "alice@example.com"
        name: "Alice"
        role: user
        createdAt: "2024-01-01T00:00:00.000Z"

    CreateUserRequest:
      type: object
      description: 사용자 생성 요청
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: 최소 8자 이상

    UpdateUserRequest:
      type: object
      description: 사용자 수정 요청 (부분 업데이트 — 모든 필드 optional)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, guest]

    AdminUsersExportRequest:
      type: object
      description: |
        사용자 PII bulk export 요청. data-eng ETL surface이며 non-admin
        perspective에서는 pseudonymization이 필수입니다.
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [json, csv]
          default: json
        pseudonymize:
          type: boolean
          default: true

    PurgeUserRequest:
      type: object
      description: site-admin 사용자 hard purge 요청. deleteUser soft-delete와 구분됩니다.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 영구 삭제 감사 사유
        legalHoldOverride:
          type: boolean
          default: false
          description: legal hold 예외 승인 여부

    PublicUserProfile:
      type: object
      description: 공개 프로필 — PII 비포함 (email/createdAt 제외)
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, guest]
      example:
        id: "00000000-0000-0000-0000-000000000001"
        name: "Alice"
        role: user

    ReportRequest:
      type: object
      description: 신고 요청 본문
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, harassment, hate-speech, fraud, impersonation, other]
        details:
          type: string
          maxLength: 1000

    Report:
      type: object
      description: 신고 단건
      required: [id, targetUserId, reporterUserId, reason, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        reporterUserId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, harassment, hate-speech, fraud, impersonation, other]
        details:
          type: string
        status:
          type: string
          enum: [open, under-review, resolved, dismissed]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
      example:
        id: "00000000-0000-0000-0000-000000000300"
        targetUserId: "00000000-0000-0000-0000-000000000001"
        reporterUserId: "00000000-0000-0000-0000-000000000002"
        reason: harassment
        status: open
        createdAt: "2026-05-04T00:00:00.000Z"
