name: staging-parity-api
scopes:
  - shared
  - public
domains:
  - common
  - health
  - users
servers:
  - url: https://api.staging.example.com/v1
    description: Staging
includePaths:
  - /health
  - /health/stream
  - /users
  - /users/{id}
namingPolicy:
  aliases:
    "securityScheme:shared/common/BearerAuth": bearerAuth
    "securityScheme:shared/common/OAuth2": oauth2
