name: local-parity-api
info:
  title: OA SDK API
  description: OpenAPI 3.2 기반 API 관리 인프라
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
scopes:
  - shared
  - public
domains:
  - common
  - auth
  - health
  - me
  - users
servers:
  - url: http://localhost:4010
    description: Mock server (@oa-sdk/mock-server)
  - url: http://localhost:3000
    description: Local dev server
tags:
  - name: health
    description: 서버 상태 확인
  - name: users
    description: 사용자 관리
  - name: auth
    description: 인증 — 토큰 발급/갱신/폐기
  - name: me
    description: 셀프 서비스 — 현재 인증된 사용자 자기 자원
includePaths:
  - /auth/register
  - /auth/login
  - /auth/refresh
  - /auth/forgot-password
  - /auth/reset-password
  - /auth/logout
  - /health
  - /health/stream
  - /health/ready
  - /version
  - /me
  - /me/onboarding
  - /me/role-changes
  - /me/export
  - /me/change-password
  - /users
  - /users/{id}
  - /users/{id}/public
  - /users/{id}/reports
  - /moderation/reports
  - /admin/users/export
  - /admin/users/{id}/purge
includeDefinitions:
  - securityScheme:shared/common/OAuth2
namingPolicy:
  aliases:
    securityScheme:shared/common/BearerAuth: bearerAuth
    securityScheme:shared/common/OAuth2: oauth2
