id: schema:shared/common/Error
content:
  type: object
  description: 표준 에러 응답 스키마
  required:
    - code
    - message
  properties:
    code:
      type: string
      description: 머신 리더블 에러 코드
      example: NOT_FOUND
    message:
      type: string
      description: 사람이 읽을 수 있는 에러 설명
      example: 요청한 리소스를 찾을 수 없습니다
    details:
      type: array
      items:
        $ref: oa://schema/shared/common/ValidationError
    _meta:
      type: object
      properties:
        operationId:
          type: string
        requestId:
          type: string
          format: uuid
  examples:
    - code: NOT_FOUND
      message: 요청한 리소스를 찾을 수 없습니다
  example:
    code: NOT_FOUND
    message: 요청한 리소스를 찾을 수 없습니다
