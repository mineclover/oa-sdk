id: schema:public/users/CreateUserRequest
content:
  type: object
  description: 사용자 생성 요청
  required: [email, name, password]
  properties:
    email:
      type: string
      format: email
    name:
      type: string
      minLength: 1
      maxLength: 100
    password:
      type: string
      minLength: 8
      description: 최소 8자 이상
