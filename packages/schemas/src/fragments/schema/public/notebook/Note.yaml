id: schema:public/notebook/Note
content:
  type: object
  description: A public note stored inside a notebook.
  required:
    - id
    - notebookId
    - body
  properties:
    id:
      type: string
      format: uuid
    notebookId:
      type: string
      format: uuid
    body:
      type: string
      minLength: 1
    updatedAt:
      type: string
      format: date-time
