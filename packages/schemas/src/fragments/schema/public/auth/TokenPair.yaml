id: schema:public/auth/TokenPair
content:
  type: object
  description: access/refresh 토큰 페어
  required:
    - accessToken
    - refreshToken
    - tokenType
    - expiresIn
  properties:
    accessToken:
      type: string
      description: bearerAuth 헤더에 사용할 JWT
    refreshToken:
      type: string
      description: /auth/refresh 호출에 사용할 장기 토큰
    tokenType:
      type: string
      enum:
        - Bearer
    expiresIn:
      type: integer
      minimum: 1
      description: accessToken 만료까지 남은 초
  example:
    accessToken: eyJhbGciOi...example
    refreshToken: rt_example_0001
    tokenType: Bearer
    expiresIn: 3600
