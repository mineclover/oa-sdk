id: schema:public/auth/RegisterRequest
content:
  type: object
  description: 회원가입 요청
  required:
    - email
    - name
    - password
  properties:
    email:
      type: string
      format: email
    name:
      type: string
      minLength: 1
      maxLength: 100
    password:
      type: string
      minLength: 8
      description: 최소 8자 이상
