id: schema:public/book/Note
content:
  type: object
  description: A public note attached to a book.
  required:
    - id
    - bookId
    - body
  properties:
    id:
      type: string
      format: uuid
    bookId:
      type: string
      format: uuid
    body:
      type: string
      minLength: 1
    notebookNote:
      $ref: oa://schema/public/notebook/Note
    createdAt:
      type: string
      format: date-time
