id: schema:public/me/ChangePasswordRequest
content:
  type: object
  description: 비밀번호 변경 요청
  required:
    - currentPassword
    - newPassword
  properties:
    currentPassword:
      type: string
      minLength: 1
    newPassword:
      type: string
      minLength: 8
      description: 최소 8자 이상
