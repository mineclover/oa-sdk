id: path:admin/book/BookNotesPath
metadata:
  path: /admin/books/{bookId}/notes
content:
  get:
    summary: List admin book notes
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: oa://schema/admin/book/Note
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: oa://schema/shared/common/Error
