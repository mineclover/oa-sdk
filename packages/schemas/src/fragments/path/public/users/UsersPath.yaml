id: path:public/users/UsersPath
metadata:
  path: /users
content:
  get:
    tags:
      - users
    operationId: listUsers
    summary: 사용자 목록 조회
    description: 페이지네이션과 역할 필터를 지원하는 사용자 목록 API
    security:
      - bearerAuth: []
    parameters:
      - $ref: oa://parameter/shared/common/Page
      - $ref: oa://parameter/shared/common/Limit
      - name: role
        in: query
        description: 역할 필터
        schema:
          type: string
          enum:
            - admin
            - user
            - guest
    responses:
      "200":
        description: 사용자 목록
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - total
              properties:
                items:
                  type: array
                  items:
                    $ref: oa://schema/public/users/User
                total:
                  type: integer
                  minimum: 0
              example:
                items:
                  - id: 00000000-0000-0000-0000-000000000001
                    email: alice@example.com
                    name: Alice
                    role: user
                    createdAt: 2024-01-01T00:00:00.000Z
                total: 1
            examples:
              default:
                dataValue:
                  items:
                    - id: 00000000-0000-0000-0000-000000000001
                      email: alice@example.com
                      name: Alice
                      role: user
                      createdAt: 2024-01-01T00:00:00.000Z
                  total: 1
                serializedValue: '{"items":[{"id":"00000000-0000-0000-0000-000000000001","email":"alice@example.com","name":"Alice","role":"user","createdAt":"2024-01-01T00:00:00.000Z"}],"total":1}'
      "401":
        $ref: oa://response/shared/common/Unauthorized
  post:
    tags:
      - users
    operationId: createUser
    summary: 사용자 생성
    description: |
      이메일, 이름, 비밀번호를 받아 새 사용자를 생성합니다. 이미 등록된 이메일은
      409 Conflict를 반환합니다.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: oa://schema/public/users/CreateUserRequest
          examples:
            default:
              dataValue:
                email: bob@example.com
                name: Bob
                password: secure1234
              serializedValue: '{"email":"bob@example.com","name":"Bob","password":"secure1234"}'
    responses:
      "201":
        description: 사용자 생성 완료
        content:
          application/json:
            schema:
              $ref: oa://schema/public/users/User
            examples:
              default:
                dataValue:
                  id: 00000000-0000-0000-0000-000000000002
                  email: bob@example.com
                  name: Bob
                  role: user
                  createdAt: 2024-01-01T00:00:00.000Z
      "400":
        $ref: oa://response/shared/common/BadRequest
      "401":
        $ref: oa://response/shared/common/Unauthorized
      "409":
        $ref: oa://response/shared/common/Conflict
      "422":
        $ref: oa://response/shared/common/UnprocessableEntity
      "500":
        $ref: oa://response/shared/common/InternalServerError
refs:
  - ref: oa://securityScheme/shared/common/BearerAuth
    sourcePointer: "#/content/get/security/0/bearerAuth"
  - ref: oa://securityScheme/shared/common/BearerAuth
    sourcePointer: "#/content/post/security/0/bearerAuth"
