id: path:public/me/MeChangePasswordPath
metadata:
  path: /me/change-password
content:
  post:
    tags:
      - me
    operationId: changeMyPassword
    summary: 내 비밀번호 변경
    description: |
      현재 비밀번호 검증 후 새 비밀번호로 교체합니다. 성공 시 기존 refresh 토큰은
      무효화될 수 있으므로 클라이언트는 재로그인 또는 refresh 흐름을 다시 시작해야 합니다.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: oa://schema/public/me/ChangePasswordRequest
          examples:
            default:
              dataValue:
                currentPassword: secure1234
                newPassword: evenmoresecure5678
              serializedValue: '{"currentPassword":"secure1234","newPassword":"evenmoresecure5678"}'
    responses:
      "204":
        description: 비밀번호 변경 완료 (본문 없음)
      "400":
        $ref: oa://response/shared/common/BadRequest
      "401":
        $ref: oa://response/shared/common/Unauthorized
      "422":
        $ref: oa://response/shared/common/UnprocessableEntity
refs:
  - ref: oa://securityScheme/shared/common/BearerAuth
    sourcePointer: "#/content/post/security/0/bearerAuth"
