id: path:public/health/HealthStreamPath
metadata:
  path: /health/stream
content:
  get:
    operationId: streamHealthEvents
    summary: 서버 상태 실시간 스트림
    description: SSE로 서버 상태 변화를 실시간으로 구독
    tags:
      - health
    security: []
    responses:
      "200":
        description: SSE 이벤트 스트림
        content:
          text/event-stream:
            itemSchema:
              type: object
              properties:
                event:
                  type: string
                data:
                  type: string
              required:
                - event
              oneOf:
                - properties:
                    data:
                      contentMediaType: application/json
                      contentSchema:
                        $ref: oa://schema/public/health/HealthEvent
                    event:
                      const: health
      "503":
        $ref: oa://response/shared/common/ServiceUnavailable
