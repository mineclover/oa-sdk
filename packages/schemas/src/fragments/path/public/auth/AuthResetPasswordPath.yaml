id: path:public/auth/AuthResetPasswordPath
metadata:
  path: /auth/reset-password
content:
  post:
    tags:
      - auth
    operationId: resetPassword
    summary: 비밀번호 재설정 (공개)
    description: forgot-password로 발급받은 reset 토큰과 새 비밀번호로 갱신.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: oa://schema/public/auth/ResetPasswordRequest
          examples:
            default:
              dataValue:
                token: rt_reset_0001
                newPassword: evenmoresecure5678
              serializedValue: '{"token":"rt_reset_0001","newPassword":"evenmoresecure5678"}'
    responses:
      "204":
        description: 비밀번호 갱신 완료 (본문 없음)
      "400":
        $ref: oa://response/shared/common/BadRequest
      "401":
        $ref: oa://response/shared/common/Unauthorized
      "422":
        $ref: oa://response/shared/common/UnprocessableEntity
