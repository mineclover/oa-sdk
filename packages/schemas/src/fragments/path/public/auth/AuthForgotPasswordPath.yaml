id: path:public/auth/AuthForgotPasswordPath
metadata:
  path: /auth/forgot-password
content:
  post:
    tags:
      - auth
    operationId: forgotPassword
    summary: 비밀번호 재설정 토큰 발송 (공개)
    description: |
      이메일로 reset 토큰 링크를 발송합니다. 이메일이 시스템에 없어도 동일한 204를
      반환 (enumeration 방지). 인증 불필요.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: oa://schema/public/auth/ForgotPasswordRequest
          examples:
            default:
              dataValue:
                email: alice@example.com
              serializedValue: '{"email":"alice@example.com"}'
    responses:
      "204":
        description: 토큰 발송 처리 완료 (본문 없음)
      "400":
        $ref: oa://response/shared/common/BadRequest
      "422":
        $ref: oa://response/shared/common/UnprocessableEntity
      "429":
        $ref: oa://response/shared/common/TooManyRequests
