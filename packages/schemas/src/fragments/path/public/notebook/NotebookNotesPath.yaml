id: path:public/notebook/NotebookNotesPath
metadata:
  path: /notebooks/{notebookId}/notes
content:
  get:
    operationId: listPublicNotebookNotes
    summary: List public notebook notes
    parameters:
      - name: notebookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: oa://schema/public/notebook/Note
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: oa://schema/shared/common/Error
