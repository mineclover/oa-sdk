id: response:shared/common/TooManyRequests
content:
  description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
  headers:
    Retry-After:
      description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
      required: true
      schema:
        type: string
        example: "30"
  content:
    application/json:
      schema:
        $ref: oa://schema/shared/common/Error
      examples:
        default:
          dataValue:
            code: RATE_LIMITED
            message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
          serializedValue: '{"code":"RATE_LIMITED","message":"요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요"}'
