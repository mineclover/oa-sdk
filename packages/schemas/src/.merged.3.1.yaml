openapi: 3.1.0
info:
  title: OA SDK API
  description: OpenAPI 3.2 기반 API 관리 인프라
  version: 0.5.0
  license:
    name: MIT
    identifier: MIT
tags:
  - name: world-model
    description: World Model Kernel — World bootstrap, stimulus ingress, revision-pinned projection query
  - name: me
    description: 셀프 서비스 — 현재 인증된 사용자 자기 자원
  - name: auth
    description: 인증 — 토큰 발급/갱신/폐기
  - name: users
    description: 사용자 관리
  - name: health
    description: 서버 상태 확인
paths:
  /admin/users/export:
    post:
      operationId: requestUsersExport
      summary: 사용자 PII bulk export 작업 요청
      description: |
        data-eng ETL surface. 사용자 PII bulk export를 비동기 job으로 등록하고
        ExportJob을 반환합니다. non-admin perspective로 소비되는 export는
        pseudonymization이 필수이며 기본값도 pseudonymize=true입니다. 호출은 audited.
      responses:
        "202":
          description: bulk export job 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
              examples:
                default:
                  value:
                    jobId: 00000000-0000-0000-0000-000000000201
                    status: queued
                    requestedAt: 2026-05-04T00:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      tags:
        - users
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUsersExportRequest"
            examples:
              default:
                value:
                  format: json
                  pseudonymize: true
      security:
        - bearerAuth: []
  /admin/users/{id}/purge:
    post:
      operationId: purgeUser
      summary: 사용자 영구 삭제
      description: |
        site-admin authority only. deleteUser와 별도의 권한 및 감사 절차를 적용하는
        hard purge입니다. legal hold override 여부와 사유를 감사 로그에 남기며
        호출은 audited.
      responses:
        "204":
          description: 영구 삭제 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeUserRequest"
            examples:
              default:
                value:
                  reason: confirmed policy violation
                  legalHoldOverride: false
      security:
        - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 영구 삭제 대상 사용자 UUID
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: 00000000-0000-0000-0000-000000000001
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: 비밀번호 재설정 토큰 발송 (공개)
      description: |
        이메일로 reset 토큰 링크를 발송합니다. 이메일이 시스템에 없어도 동일한 204를
        반환 (enumeration 방지). 인증 불필요.
      responses:
        "204":
          description: 토큰 발송 처리 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            examples:
              default:
                value:
                  email: alice@example.com
      security: []
  /auth/login:
    post:
      operationId: login
      summary: 로그인 (공개)
      description: 이메일과 비밀번호를 검증하고 access/refresh 토큰 페어를 발급합니다. 인증 불필요.
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              examples:
                default:
                  value:
                    user:
                      id: 00000000-0000-0000-0000-000000000001
                      email: alice@example.com
                      name: Alice
                      role: user
                      createdAt: 2024-01-01T00:00:00.000Z
                    tokens:
                      accessToken: eyJhbGciOi...login
                      refreshToken: rt_login_0001
                      tokenType: Bearer
                      expiresIn: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: alice@example.com
                  password: secure1234
      security: []
  /auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: 현재 access 토큰과 연결된 세션을 종료합니다. 응답 본문 없음.
      responses:
        "204":
          description: 로그아웃 완료 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - auth
      security:
        - bearerAuth: []
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: 토큰 갱신 (공개)
      description: 유효한 refresh 토큰으로 새 access 토큰 페어를 발급합니다. access 토큰 인증 불필요.
      responses:
        "200":
          description: 갱신된 토큰 페어
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
              examples:
                default:
                  value:
                    accessToken: eyJhbGciOi...refreshed
                    refreshToken: rt_login_0002
                    tokenType: Bearer
                    expiresIn: 3600
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              default:
                value:
                  refreshToken: rt_login_0001
      security: []
  /auth/register:
    post:
      operationId: register
      summary: 회원가입 (공개)
      description: 이메일·이름·비밀번호로 신규 사용자 계정을 만들고 토큰 페어를 반환합니다. 인증 불필요.
      responses:
        "201":
          description: 회원가입 + 토큰 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              examples:
                default:
                  value:
                    user:
                      id: 00000000-0000-0000-0000-000000000010
                      email: greg@example.com
                      name: Greg
                      role: user
                      createdAt: 2026-05-04T00:00:00.000Z
                    tokens:
                      accessToken: eyJhbGciOi...register
                      refreshToken: rt_register_0001
                      tokenType: Bearer
                      expiresIn: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                value:
                  email: greg@example.com
                  name: Greg
                  password: secure1234
      security: []
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: 비밀번호 재설정 (공개)
      description: forgot-password로 발급받은 reset 토큰과 새 비밀번호로 갱신.
      responses:
        "204":
          description: 비밀번호 갱신 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            examples:
              default:
                value:
                  token: rt_reset_0001
                  newPassword: evenmoresecure5678
      security: []
  /health:
    get:
      operationId: getHealth
      summary: 서버 상태 확인
      description: 서버가 정상 동작 중인지 확인하는 헬스체크 엔드포인트
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  summary: 정상 응답
                  value:
                    status: ok
                    timestamp: 2026-04-04T00:00:00.000Z
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      tags:
        - health
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      summary: 서버 준비 상태 확인 (readiness)
      description: |
        Kubernetes readiness probe / 배포 게이트용. 의존 시스템(DB, queue 등)
        검증 결과를 포함. `getHealth`(liveness)와 별개 — liveness는 프로세스
        살아있음만, readiness는 트래픽을 받을 준비가 됐는지 확인.
      responses:
        "200":
          description: 트래픽 수용 가능
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
              examples:
                default:
                  value:
                    status: ready
                    timestamp: 2026-05-04T00:00:00.000Z
                    dependencies:
                      - name: postgres
                        status: ok
                        latencyMs: 3
                      - name: redis
                        status: ok
                        latencyMs: 1
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      tags:
        - health
      security: []
  /health/stream:
    get:
      operationId: streamHealthEvents
      summary: 서버 상태 실시간 스트림
      description: SSE로 서버 상태 변화를 실시간으로 구독
      responses:
        "200":
          description: SSE 이벤트 스트림
          content:
            text/event-stream: {}
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      tags:
        - health
      security: []
  /me:
    get:
      operationId: getMe
      summary: 내 정보 조회
      description: 현재 access 토큰으로 식별되는 사용자의 정보를 반환합니다.
      responses:
        "200":
          description: 내 사용자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    email: alice@example.com
                    name: Alice
                    role: user
                    createdAt: 2024-01-01T00:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - me
      security:
        - bearerAuth: []
    delete:
      operationId: deleteMyAccount
      summary: 셀프 계정 탈퇴 (soft-delete)
      description: |
        본인 계정 비활성화. PIPA/GDPR right-to-erasure 대응. 30일 이내 복구 가능,
        이후 영구 파기. 응답 본문 없음.
      responses:
        "204":
          description: 탈퇴 처리 완료 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - me
      security:
        - bearerAuth: []
    patch:
      operationId: updateMe
      summary: 내 정보 수정 (부분 업데이트)
      description: |
        현재 사용자의 name 등 프로필을 수정합니다. role은 셀프 변경 불가 — admin이
        /users/{id} 를 통해서만 변경할 수 있습니다.
      responses:
        "200":
          description: 수정된 내 사용자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
            examples:
              default:
                value:
                  name: Alice (self-edit)
      security:
        - bearerAuth: []
  /me/change-password:
    post:
      operationId: changeMyPassword
      summary: 내 비밀번호 변경
      description: |
        현재 비밀번호 검증 후 새 비밀번호로 교체합니다. 성공 시 기존 refresh 토큰은
        무효화될 수 있으므로 클라이언트는 재로그인 또는 refresh 흐름을 다시 시작해야 합니다.
      responses:
        "204":
          description: 비밀번호 변경 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              default:
                value:
                  currentPassword: secure1234
                  newPassword: evenmoresecure5678
      security:
        - bearerAuth: []
  /me/export:
    post:
      operationId: requestMyDataExport
      summary: 내 데이터 export 작업 요청
      description: |
        GDPR 정보주체 이동권 대응. 비동기 job 생성 후 jobId를 반환합니다. 이 operation은
        수락 receipt만 정의하며 완료 알림, 상태 조회, downloadUrl 전달은 runtime 계약이 별도로
        제공해야 합니다. 동시 진행 1건 제한.
      responses:
        "202":
          description: export job 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
              examples:
                default:
                  value:
                    jobId: 00000000-0000-0000-0000-000000000200
                    status: queued
                    requestedAt: 2026-05-04T00:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      tags:
        - me
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
            examples:
              default:
                value:
                  format: json
      security:
        - bearerAuth: []
  /me/onboarding:
    get:
      operationId: getOnboardingChecklist
      summary: 온보딩 체크리스트 조회
      description: 첫 로그인 시 표시할 가이드 체크리스트. 진행률은 user state에 따름.
      responses:
        "200":
          description: 체크리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingChecklist"
              examples:
                default:
                  value:
                    items:
                      - id: complete-profile
                        title: 프로필 작성
                        completed: false
                      - id: invite-team
                        title: 팀원 초대
                        completed: false
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - me
      security:
        - bearerAuth: []
  /me/role-changes:
    get:
      operationId: listMyRoleChanges
      summary: 내 역할 변경 이력 조회
      description: |
        admin이 내 역할을 변경한 이력 일람. target-of-action 페르소나의 surface.
        변경 시점·이전/현재 역할·변경자·사유 포함.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 역할 변경 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleChangeEvent"
                  total:
                    type: integer
                    minimum: 0
                required:
                  - items
                  - total
                example:
                  items:
                    - id: 00000000-0000-0000-0000-000000000100
                      changedAt: 2026-04-01T00:00:00.000Z
                      previousRole: user
                      newRole: admin
                      changedBy: 00000000-0000-0000-0000-000000000099
                      reason: 권한 위임
                  total: 1
              examples:
                default:
                  value:
                    items:
                      - id: 00000000-0000-0000-0000-000000000100
                        changedAt: 2026-04-01T00:00:00.000Z
                        previousRole: user
                        newRole: admin
                        changedBy: 00000000-0000-0000-0000-000000000099
                        reason: 권한 위임
                    total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - me
      security:
        - bearerAuth: []
  /moderation/reports:
    get:
      operationId: listModerationReports
      summary: 신고 큐 조회 (운영자)
      description: |
        운영자(moderator) 전용. 처리 대기/처리 중 신고 일람. status 필터로
        open/under-review/resolved 등 분기.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: 신고 상태 필터
          schema:
            type: string
            enum:
              - open
              - under-review
              - resolved
              - dismissed
      responses:
        "200":
          description: 신고 큐
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
                  total:
                    type: integer
                    minimum: 0
                required:
                  - items
                  - total
                example:
                  items:
                    - id: 00000000-0000-0000-0000-000000000300
                      targetUserId: 00000000-0000-0000-0000-000000000001
                      reporterUserId: 00000000-0000-0000-0000-000000000002
                      reason: harassment
                      status: open
                      createdAt: 2026-05-04T00:00:00.000Z
                  total: 1
              examples:
                default:
                  value:
                    items:
                      - id: 00000000-0000-0000-0000-000000000300
                        targetUserId: 00000000-0000-0000-0000-000000000001
                        reporterUserId: 00000000-0000-0000-0000-000000000002
                        reason: harassment
                        status: open
                        createdAt: 2026-05-04T00:00:00.000Z
                    total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - users
      security:
        - bearerAuth: []
  /users:
    get:
      operationId: listUsers
      summary: 사용자 목록 조회
      description: 페이지네이션과 역할 필터를 지원하는 사용자 목록 API
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          description: 역할 필터
          schema:
            type: string
            enum:
              - admin
              - user
              - guest
      responses:
        "200":
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                    minimum: 0
                required:
                  - items
                  - total
                example:
                  items:
                    - id: 00000000-0000-0000-0000-000000000001
                      email: alice@example.com
                      name: Alice
                      role: user
                      createdAt: 2024-01-01T00:00:00.000Z
                  total: 1
              examples:
                default:
                  value:
                    items:
                      - id: 00000000-0000-0000-0000-000000000001
                        email: alice@example.com
                        name: Alice
                        role: user
                        createdAt: 2024-01-01T00:00:00.000Z
                    total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
      tags:
        - users
      security:
        - bearerAuth: []
    post:
      operationId: createUser
      summary: 사용자 생성
      description: |
        이메일, 이름, 비밀번호를 받아 새 사용자를 생성합니다. 이미 등록된 이메일은
        409 Conflict를 반환합니다.
      responses:
        "201":
