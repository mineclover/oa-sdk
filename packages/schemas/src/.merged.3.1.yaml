                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "404":
          description: 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다
      tags:
        - users
      security:
        - bearerAuth: []
  /users/{id}/reports:
    post:
      operationId: reportUser
      summary: 사용자 신고
      description: |
        혐오·스팸·사기 등 정책 위반 사용자를 운영자에게 신고. 신고자는 인증된
        user. 동일 신고자→대상 페어는 24시간 내 1회로 rate-limit.
      parameters:
        - name: id
          in: path
          required: true
          description: 신고 대상 사용자 UUID
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: 신고 접수 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
              examples:
                default:
                  value:
                    id: 00000000-0000-0000-0000-000000000300
                    targetUserId: 00000000-0000-0000-0000-000000000001
                    reporterUserId: 00000000-0000-0000-0000-000000000002
                    reason: harassment
                    status: open
                    createdAt: 2026-05-04T00:00:00.000Z
        "400":
          description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: BAD_REQUEST
                    message: 요청 형식이 올바르지 않습니다
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "422":
          description: 스키마 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SCHEMA_VALIDATION_FAILED
                    message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
        "429":
          description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
          headers:
            Retry-After:
              required: true
              description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: RATE_LIMITED
                    message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
            examples:
              default:
                value:
                  reason: harassment
                  details: 공격적 메시지 반복 발신
      security:
        - bearerAuth: []
  /version:
    get:
      operationId: getVersion
      summary: 빌드/배포 정보 조회
      description: 현재 실행 중인 빌드의 git sha, 빌드 시각, 배포 버전.
      parameters: []
      responses:
        "200":
          description: 빌드 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
              examples:
                default:
                  value:
                    version: 0.1.0
                    gitSha: a0ca91100000000000000000000000000000000
                    builtAt: 2026-05-04T00:00:00.000Z
      tags:
        - health
components:
  schemas:
    AdminUsersExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
            - json
            - csv
          default: json
        pseudonymize:
          type: boolean
          default: true
      unevaluatedProperties:
        not: {}
      description: |
        사용자 PII bulk export 요청. data-eng ETL surface이며 non-admin
        perspective에서는 pseudonymization이 필수입니다.
    AuthSession:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
      description: 사용자 + 토큰 페어 — 가입/로그인 응답 단위
      examples:
        - user:
            id: 00000000-0000-0000-0000-000000000001
            email: alice@example.com
            name: Alice
            role: user
            createdAt: 2024-01-01T00:00:00.000Z
          tokens:
            accessToken: eyJhbGciOi...example
            refreshToken: rt_example_0001
            tokenType: Bearer
            expiresIn: 3600
    BuildInfo:
      type: object
      required:
        - version
        - gitSha
        - builtAt
      properties:
        version:
          type: string
          description: semver 또는 빌드 식별 라벨
        gitSha:
          type: string
          minLength: 7
          description: 커밋 해시
        builtAt:
          type: string
          format: date-time
      description: 현재 실행 중인 빌드 정보
      examples:
        - version: 0.1.0
          gitSha: a0ca911
          builtAt: 2026-05-04T00:00:00.000Z
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 비밀번호 변경 요청
    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 사용자 생성 요청
    DependencyStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        latencyMs:
          type: integer
          minimum: 0
        message:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - SCHEMA_VALIDATION_FAILED
            - RATE_LIMITED
            - INTERNAL_SERVER_ERROR
            - SERVICE_UNAVAILABLE
          description: 머신 리더블 에러 코드 (페르소나 시나리오의 expected assertion 단위)
          examples:
            - NOT_FOUND
        message:
          type: string
          description: 사람이 읽을 수 있는 에러 설명
          examples:
            - 요청한 리소스를 찾을 수 없습니다
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        _meta:
          $ref: "#/components/schemas/ErrorMeta"
      description: 표준 에러 응답 스키마
      examples:
        - code: NOT_FOUND
          message: 요청한 리소스를 찾을 수 없습니다
    ErrorMeta:
      type: object
      properties:
        operationId:
          type: string
        requestId:
          type: string
          format: uuid
    ExportJob:
      type: object
      required:
        - jobId
        - status
        - requestedAt
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - ready
            - failed
        requestedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          description: status가 ready일 때만 제공
      description: export job 상태
      examples:
        - jobId: 00000000-0000-0000-0000-000000000200
          status: queued
          requestedAt: 2026-05-04T00:00:00.000Z
    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
            - json
            - csv
          default: json
      description: 데이터 export 요청
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      description: 비밀번호 재설정 토큰 발송 요청
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        timestamp:
          type: string
          format: date-time
      examples:
        - status: ok
          timestamp: 2026-04-04T00:00:00.000Z
    ListModerationReports200Body:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        total:
          type: integer
          minimum: 0
      examples:
        - items:
            - id: 00000000-0000-0000-0000-000000000300
              targetUserId: 00000000-0000-0000-0000-000000000001
              reporterUserId: 00000000-0000-0000-0000-000000000002
              reason: harassment
              status: open
              createdAt: 2026-05-04T00:00:00.000Z
          total: 1
    ListMyRoleChanges200Body:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleChangeEvent"
        total:
          type: integer
          minimum: 0
      examples:
        - items:
            - id: 00000000-0000-0000-0000-000000000100
              changedAt: 2026-04-01T00:00:00.000Z
              previousRole: user
              newRole: admin
              changedBy: 00000000-0000-0000-0000-000000000099
              reason: 권한 위임
          total: 1
    ListUsers200Body:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          minimum: 0
      examples:
        - items:
            - id: 00000000-0000-0000-0000-000000000001
              email: alice@example.com
              name: Alice
              role: user
              createdAt: 2024-01-01T00:00:00.000Z
          total: 1
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      description: 로그인 요청
    OnboardingChecklist:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingItem"
      description: 온보딩 가이드 체크리스트
      examples:
        - items:
            - id: complete-profile
              title: 프로필 작성
              completed: false
    OnboardingItem:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
        hint:
          type: string
    PublicUserProfile:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
      description: 공개 프로필 — PII 비포함 (email/createdAt 제외)
      examples:
        - id: 00000000-0000-0000-0000-000000000001
          name: Alice
          role: user
    PurgeUserRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 영구 삭제 감사 사유
        legalHoldOverride:
          type: boolean
          description: legal hold 예외 승인 여부
          default: false
      unevaluatedProperties:
        not: {}
      description: site-admin 사용자 hard purge 요청. deleteUser soft-delete와 구분됩니다.
    ReadinessReport:
      type: object
      required:
        - status
        - timestamp
        - dependencies
      properties:
        status:
          type: string
          enum:
            - ready
            - not-ready
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyStatus"
      description: readiness probe 결과 — 의존 시스템 검증 포함
      examples:
        - status: ready
          timestamp: 2026-05-04T00:00:00.000Z
          dependencies:
            - name: postgres
              status: ok
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
      description: 토큰 갱신 요청
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 회원가입 요청
    Report:
      type: object
      required:
        - id
        - targetUserId
        - reporterUserId
        - reason
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        reporterUserId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - spam
            - harassment
            - hate-speech
            - fraud
            - impersonation
            - other
        details:
          type: string
        status:
          type: string
          enum:
            - open
            - under-review
            - resolved
            - dismissed
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
      description: 신고 단건
      examples:
        - id: 00000000-0000-0000-0000-000000000300
          targetUserId: 00000000-0000-0000-0000-000000000001
          reporterUserId: 00000000-0000-0000-0000-000000000002
          reason: harassment
          status: open
          createdAt: 2026-05-04T00:00:00.000Z
    ReportRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - spam
            - harassment
            - hate-speech
            - fraud
            - impersonation
            - other
        details:
          type: string
          maxLength: 1000
      description: 신고 요청 본문
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 비밀번호 재설정 요청
    RoleChangeEvent:
      type: object
      required:
        - id
        - changedAt
        - previousRole
        - newRole
        - changedBy
      properties:
        id:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
        previousRole:
          type: string
          enum:
            - admin
            - user
            - guest
        newRole:
          type: string
          enum:
            - admin
            - user
            - guest
        changedBy:
          type: string
          format: uuid
          description: 변경을 수행한 admin의 UUID
        reason:
          type: string
      description: 역할 변경 이력 단건
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: bearerAuth 헤더에 사용할 JWT
        refreshToken:
          type: string
          description: /auth/refresh 호출에 사용할 장기 토큰
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: accessToken 만료까지 남은 초
      description: access/refresh 토큰 페어
      examples:
        - accessToken: eyJhbGciOi...example
          refreshToken: rt_example_0001
          tokenType: Bearer
          expiresIn: 3600
    UpdateMeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      description: 셀프 프로필 수정 — role은 포함 불가 (admin 전용)
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
      description: 사용자 수정 요청 (부분 업데이트 — 모든 필드 optional)
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
        createdAt:
          type: string
          format: date-time
      description: 사용자 정보
      examples:
        - id: 00000000-0000-0000-0000-000000000001
          email: alice@example.com
          name: Alice
          role: user
          createdAt: 2024-01-01T00:00:00.000Z
    ValidationError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
          examples:
            - /body/email
        message:
          type: string
          examples:
            - must match format 'email'
        received:
          description: 실제 수신된 값
          examples:
            - not-an-email
        expected:
          type: string
          examples:
            - string with format 'email'
      description: 필드 수준 유효성 검사 에러
  securitySchemes:
    bearerAuth:
      type: http
      scheme: Bearer
    oauth2:
      type: oauth2
      description: OAuth 2.0 인증 (Authorization Code + Device Authorization 지원)
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          refreshUrl: https://auth.example.com/token
          scopes:
            read: 읽기 권한
            write: 쓰기 권한
            admin: 관리자 권한
servers:
  - url: http://localhost:3000
    description: Local dev server
    variables: {}
  - url: http://localhost:4010
    description: Mock server (@oa-sdk/mock-server)
    variables: {}
