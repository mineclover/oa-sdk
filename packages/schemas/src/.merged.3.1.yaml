components:
  schemas:
    ActiveEntityId:
      type: string
      format: uuid
      description: Action role binding에 쓰는 active Entity UUID
    AdminUsersExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
            - json
            - csv
          default: json
        pseudonymize:
          type: boolean
          default: true
      description: |
        사용자 PII bulk export 요청. data-eng ETL surface이며 non-admin
        perspective에서는 pseudonymization이 필수입니다.
      additionalProperties: false
    AdvanceByLogicalDuration:
      type: object
      required:
        - kind
        - duration
      properties:
        kind:
          type: string
          enum:
            - by-duration
        duration:
          type: string
      unevaluatedProperties:
        not: {}
      description: 현재 logical time에서 duration만큼 전진하는 요청
    AdvanceToLogicalTime:
      type: object
      required:
        - kind
        - targetLogicalTime
      properties:
        kind:
          type: string
          enum:
            - to-logical-time
        targetLogicalTime:
          type: string
      unevaluatedProperties:
        not: {}
      description: 현재 logical time에서 target instant까지 전진하는 요청
    AuthSession:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
      description: 사용자 + 토큰 페어 — 가입/로그인 응답 단위
      example:
        user:
          id: 00000000-0000-0000-0000-000000000001
          email: alice@example.com
          name: Alice
          role: user
          createdAt: 2024-01-01T00:00:00.000Z
        tokens:
          accessToken: eyJhbGciOi...example
          refreshToken: rt_example_0001
          tokenType: Bearer
          expiresIn: 3600
    BuildInfo:
      type: object
      required:
        - version
        - gitSha
        - builtAt
      properties:
        version:
          type: string
          description: semver 또는 빌드 식별 라벨
        gitSha:
          type: string
          minLength: 7
          description: 커밋 해시
        builtAt:
          type: string
          format: date-time
      description: 현재 실행 중인 빌드 정보
      example:
        version: 0.1.0
        gitSha: a0ca911
        builtAt: 2026-05-04T00:00:00.000Z
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 비밀번호 변경 요청
    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 사용자 생성 요청
    CreateWorldRequest:
      type: object
      required:
        - worldId
        - modelRef
        - executionProfile
        - bootstrapSpecRef
      properties:
        worldId:
          type: string
          format: uuid
        modelRef:
          $ref: "#/components/schemas/ModelRef"
        executionProfile:
          $ref: "#/components/schemas/ExecutionProfileRef"
        bootstrapSpecRef:
          type: string
          minLength: 1
          description: 모델이 해석하는 초기 scenario/configuration reference
        runSeedMaterial:
          type: string
          description: 선택적 replay seed material. 없으면 provider가 생성한 값을 WorldControlState에 고정합니다.
      description: 새 World bootstrap 요청. 생성 뒤 ModelRef와 ExecutionProfileRef는 normal Stimulus로 바꿀 수 없습니다.
    DependencyStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        latencyMs:
          type: integer
          minimum: 0
        message:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - SCHEMA_VALIDATION_FAILED
            - RATE_LIMITED
            - INTERNAL_SERVER_ERROR
            - SERVICE_UNAVAILABLE
          description: 머신 리더블 에러 코드 (페르소나 시나리오의 expected assertion 단위)
          example: NOT_FOUND
        message:
          type: string
          description: 사람이 읽을 수 있는 에러 설명
          example: 요청한 리소스를 찾을 수 없습니다
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        _meta:
          type: object
          properties:
            operationId:
              type: string
            requestId:
              type: string
              format: uuid
      description: 표준 에러 응답 스키마
      examples:
        - code: NOT_FOUND
          message: 요청한 리소스를 찾을 수 없습니다
      example:
        code: NOT_FOUND
        message: 요청한 리소스를 찾을 수 없습니다
    ExecutionProfileRef:
      type: object
      required:
        - profileId
        - version
        - semanticFingerprint
      properties:
        profileId:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        semanticFingerprint:
          type: string
          minLength: 1
      description: World에 고정할 실행 provider 조합의 정확한 식별자
    ExecutionProfileSummary:
      type: object
      required:
        - profile
        - persistenceRecovery
        - numericSemantics
        - decisionRandom
        - commitIsolation
        - conformanceProfiles
      properties:
        profile:
          $ref: "#/components/schemas/ExecutionProfileRef"
        persistenceRecovery:
          type: string
          enum:
            - volatile
            - snapshot-journal
            - durable-outbox
        numericSemantics:
          type: string
          enum:
            - fixed-decimal
            - rational
            - strict-binary-float
        decisionRandom:
          type: string
          enum:
            - counter-derived
            - seeded-stream
        commitIsolation:
          type: string
          enum:
            - single-writer
            - optimistic-revision-cas
            - serializable-transaction
        conformanceProfiles:
          type: array
          items:
            type: string
      description: 선택 가능한 실행 profile의 공개 요약
    ExportJob:
      type: object
      required:
        - jobId
        - status
        - requestedAt
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - ready
            - failed
        requestedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          description: status가 ready일 때만 제공
      description: export job receipt. 이 계약의 POST 응답은 queued 상태만 반환하며, 이후 상태 전이와 downloadUrl 전달 방식은 runtime 계약이 별도로 정의합니다.
      example:
        jobId: 00000000-0000-0000-0000-000000000200
        status: queued
        requestedAt: 2026-05-04T00:00:00.000Z
    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
            - json
            - csv
          default: json
      description: 데이터 export 요청
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      description: 비밀번호 재설정 토큰 발송 요청
    HealthEvent:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
          description: 관측된 서버 상태
        timestamp:
          type: string
          format: date-time
          description: 이벤트 발생 시각
      description: SSE 헬스 이벤트 payload
    HealthEvents:
      $ref: "#/components/schemas/HealthEvent"
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        timestamp:
          type: string
          format: date-time
      examples:
        - status: ok
          timestamp: 2026-04-04T00:00:00.000Z
      example:
        status: ok
        timestamp: 2026-04-04T00:00:00.000Z
    ListExecutionProfilesResponseBody:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionProfileSummary"
      examples:
        - items:
            - profile:
                profileId: deterministic-local
                version: 1.0.0
                semanticFingerprint: sha256:execution-profile
              persistenceRecovery: durable-outbox
              numericSemantics: fixed-decimal
              decisionRandom: counter-derived
              commitIsolation: serializable-transaction
              conformanceProfiles:
                - replay-safe
                - single-writer
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      description: 로그인 요청
    ModelRef:
      type: object
      required:
        - modelId
        - version
        - semanticFingerprint
      properties:
        modelId:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        semanticFingerprint:
          type: string
          minLength: 1
      description: 게시된 World Model artifact의 정확한 식별자
    OnboardingChecklist:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingItem"
      description: 온보딩 가이드 체크리스트
      example:
        items:
          - id: complete-profile
            title: 프로필 작성
            completed: false
    OnboardingItem:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
        hint:
          type: string
    ProjectionBundleEnvelope:
      type: object
      required:
        - worldId
        - modelRef
        - sourceRevision
        - bundleId
        - status
        - projections
      properties:
        worldId:
          type: string
          format: uuid
        modelRef:
          $ref: "#/components/schemas/ModelRef"
        sourceRevision:
          type: integer
          format: int64
          minimum: 0
        bundleId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - complete
            - incomplete
            - stale
        projections:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionBundleItem"
      description: 같은 revision에서 함께 읽어야 하는 semantic projection bundle
      examples:
        - worldId: 00000000-0000-0000-0000-000000000401
          modelRef:
            modelId: city-sim
            version: "2026.08"
            semanticFingerprint: sha256:city-model
          sourceRevision: 42
          bundleId: world-overview
          status: complete
          projections:
            - projectionId: population-summary
              value:
                population: 1250
    ProjectionBundleItem:
      type: object
      required:
        - projectionId
        - value
      properties:
        projectionId:
          type: string
          minLength: 1
        value:
          description: PublishedModel이 선언한 projection result의 typed JSON representation
      unevaluatedProperties:
        not: {}
      description: Projection bundle의 outer world/model/revision context를 상속하는 item
    ProjectionEnvelope:
      type: object
      required:
        - worldId
        - modelRef
        - sourceRevision
        - projectionId
        - value
      properties:
        worldId:
          type: string
          format: uuid
        modelRef:
          $ref: "#/components/schemas/ModelRef"
        sourceRevision:
          type: integer
          format: int64
          minimum: 0
        projectionId:
          type: string
          minLength: 1
        value:
          description: PublishedModel이 선언한 projection result의 typed JSON representation
      description: 특정 source revision에서 materialize한 semantic projection
      examples:
        - worldId: 00000000-0000-0000-0000-000000000401
          modelRef:
            modelId: city-sim
            version: "2026.08"
            semanticFingerprint: sha256:city-model
          sourceRevision: 42
          projectionId: population-summary
          value:
            population: 1250
    PublicUserProfile:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
      description: 공개 프로필 — PII 비포함 (email/createdAt 제외)
      example:
        id: 00000000-0000-0000-0000-000000000001
        name: Alice
        role: user
    PurgeUserRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 영구 삭제 감사 사유
        legalHoldOverride:
          type: boolean
          description: legal hold 예외 승인 여부
          default: false
      description: site-admin 사용자 hard purge 요청. deleteUser와 별도의 권한 및 감사 절차를 적용합니다.
      additionalProperties: false
    ReadinessReport:
      type: object
      required:
        - status
        - timestamp
        - dependencies
      properties:
        status:
          type: string
          enum:
            - ready
            - not-ready
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyStatus"
      description: readiness probe 결과 — 의존 시스템 검증 포함
      example:
        status: ready
        timestamp: 2026-05-04T00:00:00.000Z
        dependencies:
          - name: postgres
            status: ok
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
      description: 토큰 갱신 요청
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 회원가입 요청
    Report:
      type: object
      required:
        - id
        - targetUserId
        - reporterUserId
        - reason
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        reporterUserId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - spam
            - harassment
            - hate-speech
            - fraud
            - impersonation
            - other
        details:
          type: string
        status:
          type: string
          enum:
            - open
            - under-review
            - resolved
            - dismissed
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
      description: 신고 단건
      example:
        id: 00000000-0000-0000-0000-000000000300
        targetUserId: 00000000-0000-0000-0000-000000000001
        reporterUserId: 00000000-0000-0000-0000-000000000002
        reason: harassment
        status: open
        createdAt: 2026-05-04T00:00:00.000Z
    ReportRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - spam
            - harassment
            - hate-speech
            - fraud
            - impersonation
            - other
        details:
          type: string
          maxLength: 1000
      description: 신고 요청 본문
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          description: 최소 8자 이상
      description: 비밀번호 재설정 요청
    RoleChangeEvent:
      type: object
      required:
        - id
        - changedAt
        - previousRole
        - newRole
        - changedBy
      properties:
        id:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
        previousRole:
          type: string
          enum:
            - admin
            - user
            - guest
        newRole:
          type: string
          enum:
            - admin
            - user
            - guest
        changedBy:
          type: string
          format: uuid
          description: 변경을 수행한 admin의 UUID
        reason:
          type: string
      description: 역할 변경 이력 단건
    StimulusAccepted:
      type: object
      required:
        - stimulusId
        - worldId
        - status
        - acceptedAtRevision
        - acceptedLogicalTime
      properties:
        stimulusId:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - accepted
            - duplicate
        acceptedAtRevision:
          type: integer
          format: int64
          minimum: 0
        acceptedLogicalTime:
          type: string
      description: Agenda가 받아들인 Stimulus. 이 응답은 Transaction commit 성공을 뜻하지 않습니다.
      examples:
        - stimulusId: 00000000-0000-0000-0000-000000000402
          worldId: 00000000-0000-0000-0000-000000000401
          status: accepted
          acceptedAtRevision: 42
          acceptedLogicalTime: 2030-01-01T12:00:00Z
    SubmitActionRequest:
      type: object
      required:
        - stimulusId
        - actionTypeId
        - roles
      properties:
        stimulusId:
          type: string
          format: uuid
        actionTypeId:
          type: string
          minLength: 1
        roles:
          type: object
          unevaluatedProperties:
            $ref: "#/components/schemas/ActiveEntityId"
          description: ActionRoleDefinition stable ID에서 active Entity UUID로의 binding
        parameters:
          type: object
          unevaluatedProperties: {}
          description: ActionParameterDefinition stable ID에서 typed JSON value로의 binding
        correlationId:
          type: string
        causationId:
          type: string
      description: 외부 Action 의도를 SimulationAgenda에 넣기 위한 typed envelope. role/parameter의 상세 contract는 World의 PublishedModel이 검증합니다.
    SubmitTimeAdvanceRequest:
      type: object
      required:
        - stimulusId
        - request
      properties:
        stimulusId:
          type: string
          format: uuid
        request:
          anyOf:
            - $ref: "#/components/schemas/AdvanceToLogicalTime"
            - $ref: "#/components/schemas/AdvanceByLogicalDuration"
        correlationId:
          type: string
        causationId:
          type: string
      description: TimeAdvanceRequest envelope. 한 요청은 target instant 또는 duration 중 하나만 가집니다.
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: bearerAuth 헤더에 사용할 JWT
        refreshToken:
          type: string
          description: /auth/refresh 호출에 사용할 장기 토큰
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: accessToken 만료까지 남은 초
      description: access/refresh 토큰 페어
      example:
        accessToken: eyJhbGciOi...example
        refreshToken: rt_example_0001
        tokenType: Bearer
        expiresIn: 3600
    UpdateMeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      unevaluatedProperties:
        not: {}
      description: 셀프 프로필 수정 — name만 허용하며 role과 알 수 없는 필드는 포함할 수 없음
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
      description: 사용자 수정 요청 (부분 업데이트 — 모든 필드 optional)
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - user
            - guest
        createdAt:
          type: string
          format: date-time
      description: 사용자 정보
      examples:
        - id: 00000000-0000-0000-0000-000000000001
          email: alice@example.com
          name: Alice
          role: user
          createdAt: 2024-01-01T00:00:00.000Z
      example:
        id: 00000000-0000-0000-0000-000000000001
        email: alice@example.com
        name: Alice
        role: user
        createdAt: 2024-01-01T00:00:00.000Z
    ValidationError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
          example: /body/email
        message:
          type: string
          example: must match format 'email'
        received:
          anyOf:
            - $ref: "#/components/schemas/ValidationReceivedStringSummary"
            - $ref: "#/components/schemas/ValidationReceivedArraySummary"
            - $ref: "#/components/schemas/ValidationReceivedObjectSummary"
            - $ref: "#/components/schemas/ValidationReceivedScalarSummary"
          description: 수신값의 안전한 진단 요약. 원문 문자열·객체·배열·토큰·비밀번호는 반환하지 않습니다.
          example:
            type: string
            length: 12
        expected:
          type: string
          example: string with format 'email'
      description: 필드 수준 유효성 검사 에러
    ValidationReceivedArraySummary:
      type: object
      required:
        - type
        - count
      properties:
        type:
          type: string
          enum:
            - array
        count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      unevaluatedProperties:
        not: {}
      description: 배열 수신값의 content-free 진단 요약
    ValidationReceivedObjectSummary:
      type: object
      required:
        - type
        - count
      properties:
        type:
          type: string
          enum:
            - object
        count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      unevaluatedProperties:
        not: {}
      description: 객체 수신값의 content-free 진단 요약
    ValidationReceivedScalarSummary:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - number
            - boolean
            - bigint
            - symbol
            - function
            - "null"
            - undefined
      unevaluatedProperties:
        not: {}
      description: 내용을 포함하지 않는 scalar 수신값의 진단 요약
    ValidationReceivedStringSummary:
      type: object
      required:
        - type
        - length
      properties:
        type:
          type: string
          enum:
            - string
        length:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      unevaluatedProperties:
        not: {}
      description: 문자열 수신값의 content-free 진단 요약
    WorldHead:
      type: object
      required:
        - worldId
        - modelRef
        - executionProfile
        - revision
        - logicalTime
        - lifecycle
      properties:
        worldId:
          type: string
          format: uuid
        modelRef:
          $ref: "#/components/schemas/ModelRef"
        executionProfile:
          $ref: "#/components/schemas/ExecutionProfileRef"
        revision:
          type: integer
          format: int64
          minimum: 0
        logicalTime:
          type: string
          description: 모델이 선언한 형식으로 직렬화한 현재 logical time
        lifecycle:
          type: string
          enum:
            - created
            - active
            - inactive
            - ended
      description: World의 public control head. Domain Property와 raw StateObject graph는 포함하지 않습니다.
      examples:
        - worldId: 00000000-0000-0000-0000-000000000401
          modelRef:
            modelId: city-sim
            version: "2026.08"
            semanticFingerprint: sha256:city-model
          executionProfile:
            profileId: deterministic-local
            version: 1.0.0
            semanticFingerprint: sha256:execution-profile
          revision: 42
          logicalTime: 2030-01-01T12:00:00Z
          lifecycle: active
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer 토큰 인증
    oauth2:
      type: oauth2
      description: Reserved OAuth 2.0 metadata. Current operations use bearerAuth only; assign OAuth scopes after the runtime issuer and authorization policy are approved.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          refreshUrl: https://auth.example.com/token
          scopes:
            read: 읽기 권한
            write: 쓰기 권한
            admin: 관리자 권한
  parameters:
    Limit:
      name: limit
      in: query
      description: 페이지당 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      examples:
        default:
          value: 20
    Page:
      name: page
      in: query
      description: 페이지 번호 (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
      examples:
        default:
          value: 1
  responses:
    BadRequest:
      description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: BAD_REQUEST
                message: 요청 형식이 올바르지 않습니다
    Conflict:
      description: 리소스 충돌 — 중복 식별자 또는 동시성 충돌
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: CONFLICT
                message: 이미 존재하는 리소스입니다
    Forbidden:
      description: 권한 없음 — 접근 거부
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: FORBIDDEN
                message: 이 리소스에 접근할 권한이 없습니다
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: INTERNAL_SERVER_ERROR
                message: 서버 내부 오류가 발생했습니다
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: NOT_FOUND
                message: 요청한 리소스를 찾을 수 없습니다
    ServiceUnavailable:
      description: 서비스 사용 불가
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: SERVICE_UNAVAILABLE
                message: 서비스가 일시적으로 사용 불가합니다
    TooManyRequests:
      description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
      headers:
        Retry-After:
          description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
          required: true
          schema:
            type: string
            example: "30"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: RATE_LIMITED
                message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
    Unauthorized:
      description: 인증 실패 — 토큰 없음 또는 만료
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: UNAUTHORIZED
                message: 인증이 필요합니다
    UnprocessableEntity:
      description: 스키마 유효성 검사 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                code: SCHEMA_VALIDATION_FAILED
                message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
servers:
  - url: http://localhost:4010
    description: Mock server (@oa-sdk/mock-server)
  - url: http://localhost:3000
    description: Local dev server
