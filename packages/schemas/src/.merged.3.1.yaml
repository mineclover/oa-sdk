openapi: 3.1.0
info:
  title: OA SDK API
  version: 0.1.0
tags:
  - name: me
    description: 셀프 서비스 — 현재 인증된 사용자 자기 자원
  - name: auth
    description: 인증 — 토큰 발급/갱신/폐기
  - name: users
    description: 사용자 관리
  - name: health
    description: 서버 상태 확인
paths:
  /admin/users/export:
    post:
      operationId: requestUsersExport
      summary: 사용자 PII bulk export 작업 요청
      description: |
        data-eng ETL surface. 사용자 PII bulk export를 비동기 job으로 등록하고
        ExportJob을 반환합니다. non-admin perspective로 소비되는 export는
        pseudonymization이 필수이며 기본값도 pseudonymize=true입니다. 호출은 audited.
      parameters: []
      responses:
        "202":
          description: bulk export job 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
              examples:
                default:
                  value:
                    jobId: 00000000-0000-0000-0000-000000000201
                    status: queued
                    requestedAt: 2026-05-04T00:00:00.000Z
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "403":
          description: 권한 없음 — 접근 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: FORBIDDEN
                    message: 이 리소스에 접근할 권한이 없습니다
        "429":
          description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
          headers:
            Retry-After:
              required: true
              description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: RATE_LIMITED
                    message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
      tags:
        - users
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUsersExportRequest"
            examples:
              default:
                value:
                  format: json
                  pseudonymize: true
      security:
        - bearerAuth: []
  /admin/users/{id}/purge:
    post:
      operationId: purgeUser
      summary: 사용자 영구 삭제
      description: |
        site-admin authority only. deleteUser와 달리 30일 soft-delete window를
        우회하는 hard purge입니다. legal hold override 여부와 사유를 감사 로그에
        남기며 호출은 audited.
      parameters:
        - name: id
          in: path
          required: true
          description: 영구 삭제 대상 사용자 UUID
          schema:
            type: string
            format: uuid
          examples:
            default:
              value: 00000000-0000-0000-0000-000000000001
      responses:
        "204":
          description: 영구 삭제 완료 (본문 없음)
        "400":
          description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: BAD_REQUEST
                    message: 요청 형식이 올바르지 않습니다
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "403":
          description: 권한 없음 — 접근 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: FORBIDDEN
                    message: 이 리소스에 접근할 권한이 없습니다
        "404":
          description: 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeUserRequest"
            examples:
              default:
                value:
                  reason: confirmed policy violation
                  legalHoldOverride: false
      security:
        - bearerAuth: []
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: 비밀번호 재설정 토큰 발송 (공개)
      description: |
        이메일로 reset 토큰 링크를 발송합니다. 이메일이 시스템에 없어도 동일한 204를
        반환 (enumeration 방지). 인증 불필요.
      parameters: []
      responses:
        "204":
          description: 토큰 발송 처리 완료 (본문 없음)
        "400":
          description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: BAD_REQUEST
                    message: 요청 형식이 올바르지 않습니다
        "422":
          description: 스키마 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SCHEMA_VALIDATION_FAILED
                    message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
        "429":
          description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
          headers:
            Retry-After:
              required: true
              description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: RATE_LIMITED
                    message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            examples:
              default:
                value:
                  email: alice@example.com
  /auth/login:
    post:
      operationId: login
      summary: 로그인 (공개)
      description: 이메일과 비밀번호를 검증하고 access/refresh 토큰 페어를 발급합니다. 인증 불필요.
      parameters: []
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              examples:
                default:
                  value:
                    user:
                      id: 00000000-0000-0000-0000-000000000001
                      email: alice@example.com
                      name: Alice
                      role: user
                      createdAt: 2024-01-01T00:00:00.000Z
                    tokens:
                      accessToken: eyJhbGciOi...login
                      refreshToken: rt_login_0001
                      tokenType: Bearer
                      expiresIn: 3600
        "400":
          description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: BAD_REQUEST
                    message: 요청 형식이 올바르지 않습니다
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "422":
          description: 스키마 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SCHEMA_VALIDATION_FAILED
                    message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
        "429":
          description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
          headers:
            Retry-After:
              required: true
              description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: RATE_LIMITED
                    message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: alice@example.com
                  password: secure1234
  /auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: 현재 access 토큰과 연결된 세션을 종료합니다. 응답 본문 없음.
      parameters: []
      responses:
        "204":
          description: 로그아웃 완료 (본문 없음)
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
      tags:
        - auth
      security:
        - bearerAuth: []
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: 토큰 갱신 (공개)
      description: 유효한 refresh 토큰으로 새 access 토큰 페어를 발급합니다. access 토큰 인증 불필요.
      parameters: []
      responses:
        "200":
          description: 갱신된 토큰 페어
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
              examples:
                default:
                  value:
                    accessToken: eyJhbGciOi...refreshed
                    refreshToken: rt_login_0002
                    tokenType: Bearer
                    expiresIn: 3600
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "422":
          description: 스키마 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SCHEMA_VALIDATION_FAILED
                    message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              default:
                value:
                  refreshToken: rt_login_0001
  /auth/register:
    post:
      operationId: register
      summary: 회원가입 (공개)
      description: 이메일·이름·비밀번호로 신규 사용자 계정을 만들고 토큰 페어를 반환합니다. 인증 불필요.
      parameters: []
      responses:
        "201":
          description: 회원가입 + 토큰 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              examples:
                default:
                  value:
                    user:
                      id: 00000000-0000-0000-0000-000000000010
                      email: greg@example.com
                      name: Greg
                      role: user
                      createdAt: 2026-05-04T00:00:00.000Z
                    tokens:
                      accessToken: eyJhbGciOi...register
                      refreshToken: rt_register_0001
                      tokenType: Bearer
                      expiresIn: 3600
        "400":
          description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: BAD_REQUEST
                    message: 요청 형식이 올바르지 않습니다
        "409":
          description: 리소스 충돌 — 중복 식별자 또는 동시성 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: CONFLICT
                    message: 이미 존재하는 리소스입니다
        "422":
          description: 스키마 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SCHEMA_VALIDATION_FAILED
                    message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
        "429":
          description: 요청 제한 초과 — Retry-After 헤더로 재시도 가능 시점 안내
          headers:
            Retry-After:
              required: true
              description: 재시도 가능 시점 (초 단위 정수 또는 HTTP-date)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: RATE_LIMITED
                    message: 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                value:
                  email: greg@example.com
                  name: Greg
                  password: secure1234
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: 비밀번호 재설정 (공개)
      description: forgot-password로 발급받은 reset 토큰과 새 비밀번호로 갱신.
      parameters: []
      responses:
        "204":
          description: 비밀번호 갱신 완료 (본문 없음)
        "400":
          description: 잘못된 요청 — 요청 형식 또는 파라미터 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: BAD_REQUEST
                    message: 요청 형식이 올바르지 않습니다
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
        "422":
          description: 스키마 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SCHEMA_VALIDATION_FAILED
                    message: 요청 본문이 스키마 유효성 검사를 통과하지 못했습니다
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            examples:
              default:
                value:
                  token: rt_reset_0001
                  newPassword: evenmoresecure5678
  /health:
    get:
      operationId: getHealth
      summary: 서버 상태 확인
      description: 서버가 정상 동작 중인지 확인하는 헬스체크 엔드포인트
      parameters: []
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  summary: 정상 응답
                  value:
                    status: ok
                    timestamp: 2026-04-04T00:00:00.000Z
        "503":
          description: 서비스 사용 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 서비스가 일시적으로 사용 불가합니다
      tags:
        - health
  /health/ready:
    get:
      operationId: getReadiness
      summary: 서버 준비 상태 확인 (readiness)
      description: |
        Kubernetes readiness probe / 배포 게이트용. 의존 시스템(DB, queue 등)
        검증 결과를 포함. `getHealth`(liveness)와 별개 — liveness는 프로세스
        살아있음만, readiness는 트래픽을 받을 준비가 됐는지 확인.
      parameters: []
      responses:
        "200":
          description: 트래픽 수용 가능
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
              examples:
                default:
                  value:
                    status: ready
                    timestamp: 2026-05-04T00:00:00.000Z
                    dependencies:
                      - name: postgres
                        status: ok
                        latencyMs: 3
                      - name: redis
                        status: ok
                        latencyMs: 1
        "503":
          description: 서비스 사용 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 서비스가 일시적으로 사용 불가합니다
      tags:
        - health
  /health/stream:
    get:
      operationId: streamHealthEvents
      summary: 서버 상태 실시간 스트림
      description: SSE로 서버 상태 변화를 실시간으로 구독
      parameters: []
      responses:
        "200":
          description: SSE 이벤트 스트림
        "503":
          description: 서비스 사용 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 서비스가 일시적으로 사용 불가합니다
      tags:
        - health
  /me:
    get:
      operationId: getMe
      summary: 내 정보 조회
      description: 현재 access 토큰으로 식별되는 사용자의 정보를 반환합니다.
      parameters: []
      responses:
        "200":
          description: 내 사용자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  value:
                    id: 00000000-0000-0000-0000-000000000001
                    email: alice@example.com
                    name: Alice
                    role: user
                    createdAt: 2024-01-01T00:00:00.000Z
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
                    message: 인증이 필요합니다
      tags:
        - me
      security:
        - bearerAuth: []
    delete:
      operationId: deleteMyAccount
      summary: 셀프 계정 탈퇴 (soft-delete)
      description: |
        본인 계정 비활성화. PIPA/GDPR right-to-erasure 대응. 30일 이내 복구 가능,
        이후 영구 파기. 응답 본문 없음.
      parameters: []
      responses:
        "204":
          description: 탈퇴 처리 완료 (본문 없음)
        "401":
          description: 인증 실패 — 토큰 없음 또는 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  value:
                    code: UNAUTHORIZED
