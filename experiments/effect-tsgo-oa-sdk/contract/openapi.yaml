openapi: 3.2.0
info:
  title: Effect TSGO + OA SDK isolated consumer
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4010
paths:
  /profiles/{profileId}:
    get:
      operationId: getProfile
      summary: Read one profile
      tags: [profiles]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Valid profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Missing profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    Profile:
      type: object
      additionalProperties: false
      required: [id, displayName, active]
      properties:
        id:
          type: string
        displayName:
          type: string
        active:
          type: boolean
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
