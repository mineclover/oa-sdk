openapi: 3.1.0
info:
  description: oa-sdk governance reference implementation for FastAPI services.
  title: FastAPI Reference API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Successful Response
      summary: Health
      tags:
        - health
  /users:
    get:
      operationId: list_users_users_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"
          description: Successful Response
      summary: List Users
      tags:
        - users
    post:
      operationId: create_user_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create User
      tags:
        - users
  /users/{user_id}:
    get:
      operationId: get_user_users__user_id__get
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            format: uuid
            title: User Id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get User
      tags:
        - users
    patch:
      operationId: update_user_users__user_id__patch
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            format: uuid
            title: User Id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update User
      tags:
        - users
components:
  schemas:
    CreateUserRequest:
      properties:
        email:
          format: email
          title: Email
          type: string
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        password:
          maxLength: 64
          minLength: 8
          title: Password
          type: string
      required:
        - email
        - name
        - password
      title: CreateUserRequest
      type: object
    HealthStatus:
      properties:
        status:
          pattern: ^(ok|degraded|down)$
          title: Status
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
        - status
        - timestamp
      title: HealthStatus
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    UpdateUserRequest:
      properties:
        email:
          anyOf:
            - format: email
              type: string
            - type: "null"
          title: Email
        name:
          anyOf:
            - maxLength: 120
              minLength: 1
              type: string
            - type: "null"
          title: Name
      title: UpdateUserRequest
      type: object
    User:
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        email:
          format: email
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
          default: user
      required:
        - id
        - email
        - name
        - createdAt
      title: User
      type: object
    UserRole:
      enum:
        - user
        - admin
      title: UserRole
      type: string
    UsersListResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/User"
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
        - items
        - total
      title: UsersListResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
