[project]
name = "oa-sdk-fastapi-ref"
version = "0.1.0"
description = "FastAPI -> oa-sdk governance reference implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic[email]>=2.9.0",
  "uvicorn>=0.32.0",
  "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.uv]
package = false
# package = false skips installing the project as a Python package.
# Run scripts/export_openapi.py directly: `uv run python scripts/export_openapi.py`.
# That is the source-command baked into scripts/openapi-governance.sh.
