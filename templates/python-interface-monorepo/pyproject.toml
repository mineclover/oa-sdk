[project]
name = "python-interface-contract-workspace"
version = "0.1.0"
description = "uv monorepo template for Python/Pydantic API contract management"
requires-python = ">=3.12"
dependencies = [
  "oa-interface-cli",
  "oa-interface-contracts",
  "oa-interface-fastapi",
  "example-api",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
]

[tool.uv]
package = false

[tool.uv.sources]
oa-interface-cli = { workspace = true }
oa-interface-contracts = { workspace = true }
oa-interface-fastapi = { workspace = true }
example-api = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "apps/*",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/interface-contracts/tests",
  "packages/interface-fastapi/tests",
  "packages/interface-cli/tests",
  "apps/example-api/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
  "oa_interface_contracts",
  "oa_interface_fastapi",
  "oa_interface_cli",
  "example_api",
]
