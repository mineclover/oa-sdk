[project]
name = "oa-interface-cli"
version = "0.1.0"
description = "CLI for Python interface contract management"
requires-python = ">=3.12"
dependencies = [
  "oa-interface-contracts",
  "oa-interface-fastapi",
  "rich>=14.0.0",
  "typer>=0.19.0",
]

[project.scripts]
oa-contract = "oa_interface_cli.main:app"

[tool.uv.sources]
oa-interface-contracts = { workspace = true }
oa-interface-fastapi = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
