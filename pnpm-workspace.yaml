packages:
  - "packages/*"
  - "apps/*"

# package.json#pnpm (pnpm 11은 'pnpm' 필드를 읽지 않음)
overrides:
  "@types/node": "^22.0.0"
  # 2026-10-22 security refresh: patch transitive advisories without forcing major upgrades.
  # Parent-scoped entries only apply to the pinned dependency edge that needs the fix.
  "fast-uri@": "3.1.8"
  "proxy-addr": "2.0.8"
  "qs": "6.16.1"
  "dompurify": "3.4.17"
  "ip-address@^10.0.0": "10.7.4"
  "@nestjs/swagger>js-yaml": "5.4.1"
  "@scalar/json-magic>undici": "7.29.1"
  # Dev-tooling advisories (schema lint, spectral bundler, vite/vitest).
  "protobufjs@^7.0.0": "7.6.6"
  "js-yaml@^3.0.0": "3.15.2"
  "js-yaml@^4.0.0": "4.3.2"
  "lodash": "4.18.1"
  "rollup@^2.0.0": "2.80.0"
  "postcss@^8.0.0": "8.5.31"
  "nanoid@^3.0.0": "3.3.20"
  "source-map-js@^1.0.0": "1.2.2"
  "browserslist@^4.0.0": "4.29.4"
  "baseline-browser-mapping@^2.0.0": "2.11.30"
  "brace-expansion@^1.0.0": "1.1.21"
  "brace-expansion@^5.0.0": "5.0.12"
  "minimatch@^3.0.0": "3.1.5"
  "@babel/core@^7.0.0": "7.29.7"

# .npmrc (pnpm 11은 .npmrc에서 인증/레지스트리 키만 읽음)
autoInstallPeers: true
shamefullyHoist: false
strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
engineStrict: true

# pnpm 11 strictDepBuilds 기본값(true) 대응: pnpm 10처럼 의존성 빌드 스크립트는 실행하지 않음
# (pnpm-lock.yaml이 requiresBuild를 기록하지 않아 레지스트리 hasInstallScript 기준으로 목록 산출)
allowBuilds:
  "@nestjs/core": false # postinstall (opencollective 안내)
  "@scarf/scarf": false # postinstall (telemetry, @nestjs/swagger 11 → swagger-ui-dist)
  better-sqlite3: false # install (네이티브 애드온, node:sqlite 폴백 사용)
  core-js: false # postinstall (후원 안내)
  esbuild: false # postinstall (바이너리 검증, 플랫폼 패키지로 대체됨)
  fsevents: false # install (node-gyp, macOS 선택 의존성)
  msw: false # postinstall (service worker 복사)
  protobufjs: false # postinstall (버전 스킴 안내)
